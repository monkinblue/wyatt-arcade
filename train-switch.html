<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Switchyard Express!</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="train-switch.css">
  <style>
    .mode-bar { scrollbar-width: none; }
    .mode-bar::-webkit-scrollbar { display: none; }
    .whistle-btn.attention {
      animation: whistlePulse 0.55s infinite alternate ease-in-out;
    }
    @keyframes whistlePulse {
      from { transform: scale(1); box-shadow: 0 8px 0 #92400E, 0 0 12px #FDE047; }
      to { transform: scale(1.06); box-shadow: 0 8px 0 #92400E, 0 0 34px #FDE047; }
    }
  </style>
</head>
<body>
  <div id="train-app">
    <header>
      <a href="index.html" class="nav-btn">🏠 Back</a>
      <div class="mode-bar">
        <button class="mode-btn" data-mode="shapes">🎨 Shapes</button>
        <button class="mode-btn" data-mode="numbers">🔢 Count</button>
        <button class="mode-btn" data-mode="words">🔤 Word Train</button>
        <button class="mode-btn" data-mode="free">🚂 Free Play</button>
      </div>
      <div class="score-pill">🚃 <span id="car-count">1</span> Cars • ⭐ <span id="score-val">0</span></div>
    </header>

    <main class="cockpit">
      <aside class="side-panel">
        <div class="panel-label">THROTTLE</div>
        <button class="gear-btn" data-gear="2"><span class="g-icon">🔥</span>TURBO</button>
        <button class="gear-btn active" data-gear="1"><span class="g-icon">🚂</span>CHUG</button>
        <button class="gear-btn" data-gear="0"><span class="g-icon">🛑</span>STOP</button>
        <button class="gear-btn" data-gear="-1"><span class="g-icon">⏪</span>BACK</button>
      </aside>

      <section class="table-wrap">
        <div class="mission-banner" id="mission-banner" title="Tap to hear instructions!">Tap glowing switches to steer the train!</div>
        <canvas id="rail-canvas"></canvas>
      </section>

      <aside class="side-panel">
        <div class="cargo-box">
          <div class="panel-label" id="goal-label">NEXT GOAL</div>
          <div class="cargo-badge" id="goal-badge">⭐</div>
        </div>
        <button class="whistle-btn" id="whistle-btn">
          <span style="font-size:44px;">📯</span>
          <span>TOOT!</span>
          <span style="font-size:12px;opacity:0.9;">Shoo Critters!</span>
        </button>
      </aside>
    </main>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const profile = params.get('kid') || localStorage.getItem('activeKid') || 'wyatt';
    const isEmma = profile === 'emma';

    function syncViewport() {
      const vv = window.visualViewport;
      const w = Math.round(vv ? vv.width : document.documentElement.clientWidth || window.innerWidth);
      const h = Math.round(vv ? vv.height : document.documentElement.clientHeight || window.innerHeight);
      if (w > 0 && h > 0) {
        document.documentElement.style.setProperty('--app-w', `${w}px`);
        document.documentElement.style.setProperty('--app-h', `${h}px`);
      }
    }
    window.addEventListener('resize', syncViewport);
    window.addEventListener('pageshow', syncViewport);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', syncViewport);
    if ('ResizeObserver' in window) new ResizeObserver(syncViewport).observe(document.documentElement);
    [0, 80, 250].forEach(ms => setTimeout(syncViewport, ms));

    const CW = 900, CH = 520;
    const canvas = document.getElementById('rail-canvas');
    canvas.width = CW; canvas.height = CH;
    const ctx = canvas.getContext('2d');

    // Load Hi-Bit Pixel Art Valley Map (.jpeg with .jpg/.png fallbacks)
    const bgImg = new Image();
    let bgReady = false;
    const bgFallbacks = ['images/train-valley.jpeg', 'images/train-valley.jpg', 'images/train-valley.png', 'train-valley.jpeg'];
    let bgTryIdx = 0;
    bgImg.onload = () => { bgReady = true; };
    bgImg.onerror = () => {
      bgTryIdx++;
      if (bgTryIdx < bgFallbacks.length) bgImg.src = bgFallbacks[bgTryIdx];
    };
    bgImg.src = bgFallbacks[0];

    // Track Nodes & Directed Quadratic Bezier Track Segments
    const NODES = [
      { x: 230, y: 92 },  // 0: Top-Left Switch -> Top Main (1) or Red Siding (2)
      { x: 670, y: 92 },  // 1: Top-Right Switch -> Right Curve (3) or Center River Bridge (4)
      { x: 790, y: 260 }, // 2: Right Mid -> Bottom-Right Curve (5)
      { x: 670, y: 428 }, // 3: Bottom-Right Switch -> Bottom Main (6) or Gold Siding (7)
      { x: 230, y: 428 }, // 4: Bottom-Left Merge -> Bottom-Left Curve (8)
      { x: 110, y: 260 }  // 5: Left Mid -> Top-Left Curve (0)
    ];

    const EDGES = [
      { id: 0, from: 5, to: 0, cp: { x: 110, y: 92 } },                       // 0: Top-Left Curve (Blue Harbor)
      { id: 1, from: 0, to: 1, cp: { x: 450, y: 92 } },                       // 1: Top Straight Main
      { id: 2, from: 0, to: 1, cp: { x: 450, y: 205 } },                      // 2: Top Curved Siding (Red Barn)
      { id: 3, from: 1, to: 2, cp: { x: 790, y: 92 } },                       // 3: Top-Right Curve
      { id: 4, from: 1, to: 4, cp: { x: 450, y: 260 } },                      // 4: Center Diagonal River Bridge
      { id: 5, from: 2, to: 3, cp: { x: 790, y: 428 } },                      // 5: Bottom-Right Curve (Green Mill)
      { id: 6, from: 3, to: 4, cp: { x: 450, y: 428 } },                      // 6: Bottom Straight Main
      { id: 7, from: 3, to: 4, cp: { x: 450, y: 315 } },                      // 7: Bottom Curved Siding (Gold Bakery)
      { id: 8, from: 4, to: 5, cp: { x: 110, y: 428 } }                       // 8: Bottom-Left Curve
    ];

    // ONLY the 3 True Physical Switches (No hidden 4th switch lighting up disabled tracks!)
    const SWITCHES = [
      { node: 0, options: [1, 2], activeIdx: 0, x: 230, y: 92 },  // Top-Left: Top Straight (1) vs Red Siding (2)
      { node: 1, options: [3, 4], activeIdx: 0, x: 670, y: 92 },  // Top-Right: Outer Loop (3) vs Center Bridge (4)
      { node: 3, options: [6, 7], activeIdx: 0, x: 670, y: 428 }  // Bottom-Right: Bottom Straight (6) vs Gold Siding (7)
    ];

    const STATIONS = [
      { id: 'red',   name: 'Red Barn',    color: '#EF4444', shape: '❤️', edgeId: 2, t: 0.5, roofX: 375, roofY: 184 },
      { id: 'green', name: 'Green Mill',  color: '#10B981', shape: '🍀', edgeId: 5, t: 0.45, roofX: 816, roofY: 348 },
      { id: 'gold',  name: 'Gold Bakery', color: '#F59E0B', shape: '⭐', edgeId: 7, t: 0.5, roofX: 525, roofY: 336 },
      { id: 'blue',  name: 'Blue Harbor', color: '#3B82F6', shape: '💎', edgeId: 0, t: 0.55, roofX: 90,  roofY: 162 }
    ];

    // Pre-sample dense points along every Bezier track segment
    EDGES.forEach(e => {
      const p0 = NODES[e.from], p1 = e.cp, p2 = NODES[e.to];
      e.pts = [];
      let len = 0;
      for (let i = 0; i <= 90; i++) {
        const t = i / 90;
        const mt = 1 - t;
        const x = mt * mt * p0.x + 2 * mt * t * p1.x + t * t * p2.x;
        const y = mt * mt * p0.y + 2 * mt * t * p1.y + t * t * p2.y;
        if (i > 0) len += Math.hypot(x - e.pts[i - 1].x, y - e.pts[i - 1].y);
        e.pts.push({ x, y, d: len });
      }
      e.length = len;
    });

    function sampleEdge(edgeId, dist) {
      const e = EDGES[edgeId];
      const clamped = Math.max(0, Math.min(e.length, dist));
      for (let i = 1; i < e.pts.length; i++) {
        if (e.pts[i].d >= clamped) {
          const a = e.pts[i - 1], b = e.pts[i];
          const f = (clamped - a.d) / Math.max(0.001, b.d - a.d);
          return {
            x: a.x + (b.x - a.x) * f,
            y: a.y + (b.y - a.y) * f,
            angle: Math.atan2(b.y - a.y, b.x - a.x)
          };
        }
      }
      const last = e.pts[e.pts.length - 1];
      return { x: last.x, y: last.y, angle: 0 };
    }

    // Track-Graph Routing (Forward & Reverse!)
    // Also records recent edges traversed so trailing cars stay locked to exact path across switches!
    let curEdge = 1;
    let curDist = 110;
    let recentEdges = [0, 8, 6, 5, 3]; // Edges behind curEdge for multi-car coupling

    function nextForwardEdge(atNode) {
      const sw = SWITCHES.find(s => s.node === atNode);
      if (sw) return sw.options[sw.activeIdx];
      const match = EDGES.find(e => e.from === atNode);
      return match ? match.id : 1;
    }

    function prevBackwardEdge(atNode) {
      // If we have exact history of the edge we came from, follow it seamlessly;
      // otherwise obey the current switch setting at merge nodes!
      if (atNode === 1) {
        const sw0 = SWITCHES.find(s => s.node === 0);
        return sw0 ? sw0.options[sw0.activeIdx] : 1;
      }
      if (atNode === 4) {
        // Node 4 merges Center Bridge (4), Bottom Main (6), and Gold Siding (7)
        const sw3 = SWITCHES.find(s => s.node === 3);
        return sw3 ? sw3.options[sw3.activeIdx] : 6;
      }
      const match = EDGES.find(e => e.to === atNode);
      return match ? match.id : 8;
    }

    // Exact Real-Time Car Placement Along Track Graph (Never freezes or drifts during Reverse!)
    function getTrainCarPose(offsetBehindHead) {
      let eId = curEdge;
      let d = curDist - offsetBehindHead;
      let histPtr = 0;

      while (d < 0) {
        const prevId = recentEdges[histPtr] !== undefined
          ? recentEdges[histPtr]
          : prevBackwardEdge(EDGES[eId].from);
        histPtr++;
        eId = prevId;
        d += EDGES[eId].length;
      }
      return sampleEdge(eId, d);
    }

    let gameMode = isEmma ? 'shapes' : 'words';
    let gear = 1;
    let score = 0;
    let cars = [{ color: isEmma ? '#F472B6' : '#10B981', label: isEmma ? '🐶' : '🐉' }];

    const WORD_LIST = [isEmma ? 'EMMA' : 'WYATT', isEmma ? 'WYATT' : 'EMMA', 'TRAIN', 'DOG', 'CAT', 'STAR'];
    let wordIdx = 0;
    let wordLetterIdx = 0;
    let heldCargo = null;
    let pickupItem = null;
    let targetStation = null;
    let critter = null;
    let critterAlerted = false;
    let smoke = [];
    let rings = [];
    let confetti = [];
    let tick = 0;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function speak(txt) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.rate = 0.94; u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    }

    function playTone(f1, f2, dur = 0.16, type = 'triangle', vol = 0.22) {
      initAudio();
      const now = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f1, now);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, f2), now + dur);
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now); o.stop(now + dur);
    }

    function playWhistle() {
      initAudio();
      [587.33, 739.99, 880].forEach(f => playTone(f, f * 0.99, 0.45, 'triangle', 0.18));
    }

    function spawnConfetti(x, y, color) {
      for (let i = 0; i < 24; i++) {
        const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
        confetti.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, color: i % 2 ? '#FDE047' : color, life: 34 });
      }
    }

    function shooActiveCritter() {
      if (critter && !critter.shooing) {
        critter.shooing = true;
        critter.vy = -5.5;
        critter.vx = 3.5;
        critterAlerted = false;
        document.getElementById('whistle-btn').classList.remove('attention');
        speak(critter.sound);
      }
    }

    function setupMission(announce = true) {
      heldCargo = null;
      pickupItem = null;
      targetStation = null;

      if (gameMode === 'free') {
        document.getElementById('mission-banner').textContent = '🚂 Free Play! Flip switches, reverse & blow the whistle!';
        document.getElementById('goal-label').textContent = 'SANDBOX';
        document.getElementById('goal-badge').textContent = '🚂';
        document.getElementById('goal-badge').style.background = '#1E293B';
        return;
      }

      if (gameMode === 'shapes') {
        const st = STATIONS[Math.floor(Math.random() * STATIONS.length)];
        targetStation = st;
        const spawnEdges = [1, 4, 6, 8].filter(id => id !== curEdge && (!critter || critter.edgeId !== id));
        const pEdge = spawnEdges[Math.floor(Math.random() * spawnEdges.length)];
        pickupItem = { edgeId: pEdge, dist: EDGES[pEdge].length * 0.5, label: st.shape, color: st.color };
        document.getElementById('mission-banner').textContent = `Pick up ${st.shape} on the tracks, then steer to ${st.name}!`;
        document.getElementById('goal-label').textContent = 'PICK UP';
        document.getElementById('goal-badge').textContent = st.shape;
        document.getElementById('goal-badge').style.background = st.color;
        if (announce) speak(`Pick up ${st.name.split(' ')[0]} cargo!`);
      } else if (gameMode === 'numbers') {
        const num = (isEmma ? 1 : 2) + Math.floor(Math.random() * (isEmma ? 5 : 8));
        const st = STATIONS[Math.floor(Math.random() * STATIONS.length)];
        targetStation = st;
        const spawnEdges = [1, 4, 6, 8].filter(id => id !== curEdge && (!critter || critter.edgeId !== id));
        const pEdge = spawnEdges[Math.floor(Math.random() * spawnEdges.length)];
        pickupItem = { edgeId: pEdge, dist: EDGES[pEdge].length * 0.5, label: String(num), color: st.color, num };
        document.getElementById('mission-banner').textContent = `Pick up Crate #${num} & deliver to ${st.name}!`;
        document.getElementById('goal-label').textContent = `CRATE #${num}`;
        document.getElementById('goal-badge').textContent = num;
        document.getElementById('goal-badge').style.background = st.color;
        if (announce) speak(`Number ${num} to the ${st.name}!`);
      } else if (gameMode === 'words') {
        const word = WORD_LIST[wordIdx % WORD_LIST.length];
        const ch = word[wordLetterIdx];
        const candidateEdges = [1, 3, 4, 6, 8].filter(id => id !== curEdge && (!critter || critter.edgeId !== id));
        const pEdge = candidateEdges[Math.floor(Math.random() * candidateEdges.length)];
        const color = ['#EF4444', '#3B82F6', '#F59E0B', '#10B981', '#A855F7'][wordLetterIdx % 5];
        pickupItem = { edgeId: pEdge, dist: EDGES[pEdge].length * 0.5, label: ch, color, isLetter: true };
        document.getElementById('mission-banner').textContent = `Spell ${word}: Steer to collect Letter "${ch}"!`;
        document.getElementById('goal-label').textContent = word;
        document.getElementById('goal-badge').textContent = ch;
        document.getElementById('goal-badge').style.background = color;
        if (announce) speak(ch);
      }
    }

    function maybeSpawnCritter() {
      if (critter || Math.random() > 0.003) return;
      // Never spawn a critter on the same track as the train or an active pickup orb!
      const candidates = [1, 4, 6].filter(id => id !== curEdge && (!pickupItem || pickupItem.edgeId !== id));
      if (candidates.length === 0) return;
      const eId = candidates[Math.floor(Math.random() * candidates.length)];
      const types = [
        { icon: '🐄', sound: 'Moo!' },
        { icon: '🐑', sound: 'Baa!' },
        { icon: '🐸', sound: 'Ribbit!' }
      ];
      const c = types[Math.floor(Math.random() * types.length)];
      critter = { edgeId: eId, dist: EDGES[eId].length * 0.5, ...c, shooing: false, vx: 0, vy: 0 };
      critterAlerted = false;
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === gameMode);
      btn.onpointerdown = () => {
        gameMode = btn.dataset.mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        cars = [cars[0]];
        wordLetterIdx = 0;
        document.getElementById('car-count').textContent = cars.length;
        setupMission(true);
      };
    });

    document.querySelectorAll('.gear-btn').forEach(btn => {
      btn.onpointerdown = () => {
        gear = Number(btn.dataset.gear);
        document.querySelectorAll('.gear-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        playTone(gear === -1 ? 260 : 380, gear === 0 ? 180 : 520, 0.12);
      };
    });

    const whistleBtn = document.getElementById('whistle-btn');
    whistleBtn.onpointerdown = () => {
      whistleBtn.classList.add('pulling');
      setTimeout(() => whistleBtn.classList.remove('pulling'), 220);
      playWhistle();
      const head = sampleEdge(curEdge, curDist);
      rings.push({ x: head.x, y: head.y, r: 12, alpha: 1 });
      shooActiveCritter();
    };

    document.getElementById('mission-banner').onpointerdown = () => {
      speak(document.getElementById('mission-banner').textContent);
    };

    canvas.addEventListener('pointerdown', (e) => {
      const r = canvas.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * CW;
      const y = ((e.clientY - r.top) / r.height) * CH;

      // Allow tapping directly on a sleepy critter to shoo it too!
      if (critter && !critter.shooing) {
        const cp = sampleEdge(critter.edgeId, critter.dist);
        if (Math.hypot(x - cp.x, y - cp.y) <= 44) {
          playWhistle();
          rings.push({ x: cp.x, y: cp.y, r: 12, alpha: 1 });
          shooActiveCritter();
          return;
        }
      }

      for (const sw of SWITCHES) {
        if (Math.hypot(x - sw.x, y - sw.y) <= 48) {
          sw.activeIdx = (sw.activeIdx + 1) % sw.options.length;
          playTone(320, 680, 0.09, 'square', 0.2);
          spawnConfetti(sw.x, sw.y, '#FDE047');
          return;
        }
      }
    });

    function updateTrain() {
      maybeSpawnCritter();

      // Check if critter is blocking the track in the direction we are trying to move!
      let blockedByCritter = false;
      if (critter && !critter.shooing && critter.edgeId === curEdge) {
        const gap = critter.dist - curDist;
        if ((gear > 0 && gap > -10 && gap < 56) || (gear < 0 && gap < 10 && gap > -56)) {
          blockedByCritter = true;
          if (!critterAlerted) {
            critterAlerted = true;
            speak(`${critter.sound} Blow the whistle!`);
            whistleBtn.classList.add('attention');
          }
        } else {
          critterAlerted = false;
          whistleBtn.classList.remove('attention');
        }
      } else {
        whistleBtn.classList.remove('attention');
      }

      const rawSpeed = gear === 2 ? 3.4 : (gear === 1 ? 2.0 : (gear === -1 ? -2.0 : 0));
      const speed = blockedByCritter ? 0 : rawSpeed;

      if (speed !== 0) {
        curDist += speed;

        // Seamless Forward Transitions
        while (curDist > EDGES[curEdge].length) {
          const overflow = curDist - EDGES[curEdge].length;
          recentEdges.unshift(curEdge);
          if (recentEdges.length > 20) recentEdges.pop();
          const endNode = EDGES[curEdge].to;
          curEdge = nextForwardEdge(endNode);
          curDist = overflow;
        }

        // Seamless Reverse Transitions (Never loses the train or cars!)
        while (curDist < 0) {
          const underflow = -curDist;
          const prevEdge = recentEdges.length > 0
            ? recentEdges.shift()
            : prevBackwardEdge(EDGES[curEdge].from);
          curEdge = prevEdge;
          curDist = EDGES[curEdge].length - underflow;
          // Ensure recentEdges always stays populated behind us even on endless reverse loops!
          if (recentEdges.length < 8) {
            let tailEdge = recentEdges.length > 0 ? recentEdges[recentEdges.length - 1] : curEdge;
            for (let k = 0; k < 6; k++) {
              tailEdge = prevBackwardEdge(EDGES[tailEdge].from);
              recentEdges.push(tailEdge);
            }
          }
        }

        const head = sampleEdge(curEdge, curDist);
        if (tick % (gear === 2 ? 6 : 11) === 0) {
          smoke.push({ x: head.x, y: head.y, r: 7, alpha: 0.75 });
        }
      }

      // Check pickups & deliveries against BOTH the locomotive AND caboose when reversing!
      const head = sampleEdge(curEdge, curDist);

      if (pickupItem) {
        const itemPos = sampleEdge(pickupItem.edgeId, pickupItem.dist);
        if (Math.hypot(head.x - itemPos.x, head.y - itemPos.y) < 40) {
          playTone(523.25, 880, 0.2, 'triangle', 0.28);
          spawnConfetti(itemPos.x, itemPos.y, pickupItem.color);

          if (pickupItem.isLetter) {
            cars.push({ color: pickupItem.color, label: pickupItem.label });
            score += 25;
            document.getElementById('car-count').textContent = cars.length;
            document.getElementById('score-val').textContent = score;

            const word = WORD_LIST[wordIdx % WORD_LIST.length];
            wordLetterIdx++;
            if (wordLetterIdx >= word.length) {
              speak(`${word}!`);
              playWhistle();
              score += 100;
              document.getElementById('score-val').textContent = score;
              wordIdx++;
              wordLetterIdx = 0;
              pickupItem = null;
              setTimeout(() => {
                cars = [cars[0]];
                document.getElementById('car-count').textContent = 1;
                setupMission(true);
              }, 1300);
            } else {
              setupMission(true);
            }
          } else {
            heldCargo = pickupItem;
            pickupItem = null;
            document.getElementById('goal-label').textContent = 'DELIVER TO';
            document.getElementById('mission-banner').textContent = `Great! Now steer to deliver ${heldCargo.label} to ${targetStation.name}!`;
            speak(`Take it to ${targetStation.name}!`);
          }
        }
      }

      if (heldCargo && targetStation) {
        const stPos = sampleEdge(targetStation.edgeId, EDGES[targetStation.edgeId].length * targetStation.t);
        if (Math.hypot(head.x - stPos.x, head.y - stPos.y) < 44) {
          playWhistle();
          score += 50;
          cars.push({ color: heldCargo.color, label: heldCargo.label });
          if (cars.length > 7) cars.splice(1, 1);
          document.getElementById('car-count').textContent = cars.length;
          document.getElementById('score-val').textContent = score;
          spawnConfetti(stPos.x, stPos.y, targetStation.color);
          speak('Delivered!');
          setupMission(false);
        }
      }
    }

    function drawTrackEdge(e, isLit) {
      const p0 = NODES[e.from], p1 = e.cp, p2 = NODES[e.to];
      ctx.save();
      ctx.strokeStyle = '#5C3A21';
      ctx.lineWidth = 22;
      ctx.setLineDash([6, 11]);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.quadraticCurveTo(p1.x, p1.y, p2.x, p2.y);
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.strokeStyle = isLit ? '#FDE047' : '#94A3B8';
      ctx.lineWidth = isLit ? 12 : 8;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.quadraticCurveTo(p1.x, p1.y, p2.x, p2.y);
      ctx.stroke();

      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.quadraticCurveTo(p1.x, p1.y, p2.x, p2.y);
      ctx.stroke();
      ctx.restore();
    }

    function render() {
      tick++;
      updateTrain();
      ctx.clearRect(0, 0, CW, CH);

      if (bgReady) {
        ctx.drawImage(bgImg, 0, 0, CW, CH);
      } else {
        ctx.fillStyle = '#2E6F40';
        ctx.fillRect(0, 0, CW, CH);
      }

      // Draw Unselected Switch Branches First, Then Selected Gold Branches on Top!
      const disabledSwitchEdges = new Set();
      const enabledSwitchEdges = new Set();
      SWITCHES.forEach(sw => {
        sw.options.forEach((edgeId, idx) => {
          if (idx === sw.activeIdx) enabledSwitchEdges.add(edgeId);
          else disabledSwitchEdges.add(edgeId);
        });
      });

      EDGES.forEach(e => {
        if (disabledSwitchEdges.has(e.id)) drawTrackEdge(e, false);
      });
      EDGES.forEach(e => {
        if (!disabledSwitchEdges.has(e.id)) drawTrackEdge(e, enabledSwitchEdges.has(e.id));
      });

      // Draw Station Depots
      STATIONS.forEach(st => {
        const isTarget = targetStation && targetStation.id === st.id;
        const pulse = isTarget ? Math.sin(tick * 0.16) * 5 : 0;
        ctx.save();
        ctx.translate(st.roofX, st.roofY);
        ctx.fillStyle = st.color;
        ctx.strokeStyle = isTarget ? '#FDE047' : '#FFF';
        ctx.lineWidth = isTarget ? 5 : 3;
        ctx.beginPath();
        ctx.roundRect(-44 - pulse / 2, -24 - pulse / 2, 88 + pulse, 48 + pulse, 14);
        ctx.fill(); ctx.stroke();
        ctx.font = 'bold 14px Fredoka, sans-serif';
        ctx.fillStyle = '#FFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(st.shape + ' ' + st.name.split(' ')[0], 0, 1);
        ctx.restore();
      });

      // Draw 3 Interactive Track Switch Circles
      SWITCHES.forEach(sw => {
        const chosenEdge = EDGES[sw.options[sw.activeIdx]];
        const sample = sampleEdge(chosenEdge.id, 38);
        const ang = Math.atan2(sample.y - sw.y, sample.x - sw.x);

        ctx.save();
        ctx.translate(sw.x, sw.y);
        ctx.beginPath();
        ctx.arc(0, 0, 26, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#FDE047';
        ctx.stroke();

        ctx.rotate(ang);
        ctx.fillStyle = '#06D6A0';
        ctx.beginPath();
        ctx.moveTo(15, 0); ctx.lineTo(-8, -11); ctx.lineTo(-4, 0); ctx.lineTo(-8, 11);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      // Draw Pickup Orb
      if (pickupItem) {
        const p = sampleEdge(pickupItem.edgeId, pickupItem.dist);
        const bob = Math.sin(tick * 0.14) * 5;
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y + bob, 24, 0, Math.PI * 2);
        ctx.fillStyle = pickupItem.color;
        ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = '#FFF'; ctx.stroke();
        ctx.font = 'bold 24px Fredoka, sans-serif';
        ctx.fillStyle = '#FFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(pickupItem.label, p.x, p.y + bob);
        ctx.restore();
      }

      // Draw Sleepy Track Critter
      if (critter) {
        const cp = sampleEdge(critter.edgeId, critter.dist);
        if (critter.shooing) {
          critter.x = (critter.x || cp.x) + critter.vx;
          critter.y = (critter.y || cp.y) + critter.vy;
          critter.vy += 0.25;
          if (critter.y > CH + 50 || critter.x > CW + 50) critter = null;
        }
        if (critter) {
          ctx.font = '40px sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(critter.icon, critter.x || cp.x, critter.y || cp.y);
          if (!critter.shooing) {
            ctx.font = 'bold 15px Fredoka, sans-serif';
            ctx.fillStyle = '#FDE047';
            ctx.strokeStyle = '#0F172A';
            ctx.lineWidth = 4;
            ctx.strokeText('📯 TOOT!', cp.x, cp.y - 30);
            ctx.fillText('📯 TOOT!', cp.x, cp.y - 30);
          }
        }
      }

      // Draw Train Cars & Locomotive Using Exact Graph Math
      for (let c = cars.length - 1; c >= 0; c--) {
        const pt = getTrainCarPose(c * 48);
        const car = cars[c];

        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(pt.angle);
        ctx.fillStyle = c === 0 ? '#EF4444' : car.color;
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(-22, -15, 44, 30, 9);
        ctx.fill(); ctx.stroke();

        if (c === 0) {
          ctx.fillStyle = '#FDE047';
          ctx.fillRect(14, -12, 8, 24);
        }
        ctx.rotate(-pt.angle);
        ctx.font = 'bold 20px Fredoka, sans-serif';
        ctx.fillStyle = '#FFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(c === 0 && heldCargo ? heldCargo.label : car.label, 0, 1);
        ctx.restore();
      }

      // Smoke, Whistle Rings & Confetti
      for (let i = smoke.length - 1; i >= 0; i--) {
        const s = smoke[i];
        s.r += 0.45; s.alpha -= 0.02; s.y -= 0.6;
        if (s.alpha <= 0) { smoke.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        r.r += 7; r.alpha -= 0.03;
        if (r.alpha <= 0) { rings.splice(i, 1); continue; }
        ctx.strokeStyle = `rgba(253,224,71,${r.alpha})`;
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
      }
      for (let i = confetti.length - 1; i >= 0; i--) {
        const p = confetti[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life--;
        if (p.life <= 0) { confetti.splice(i, 1); continue; }
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 6, 6);
      }

      requestAnimationFrame(render);
    }

    setupMission(true);
    render();
  </script>
</body>
