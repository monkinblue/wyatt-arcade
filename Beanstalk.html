<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wyatt, Emma & the Magic Beanstalk</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    body {
      font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
      height: 100vh; width: 100vw; overflow: hidden;
      display: flex; flex-direction: column;
      background: #1D3557;
      touch-action: manipulation;
    }

    /* Top Storybook HUD */
    header {
      position: absolute; top: 16px; left: 24px; right: 24px; z-index: 50;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .hud-btn, .backpack-bar {
      pointer-events: auto;
      background: rgba(255,255,255,0.94); border: 4px solid #fff;
      padding: 10px 22px; border-radius: 40px; font-size: 20px; font-weight: 700;
      color: #1D3557; box-shadow: 0 8px 20px rgba(0,0,0,0.18);
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      text-decoration: none; transition: transform 0.15s;
    }
    .hud-btn:active { transform: scale(0.94); }
    .backpack-bar {
      background: #FFD166; padding: 8px 20px; gap: 12px;
    }
    .pack-slot {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,0.85); border: 2px dashed #1D3557;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; cursor: pointer; transition: transform 0.2s;
    }
    .pack-slot.filled { border-style: solid; background: #fff; }
    .pack-slot:active { transform: scale(1.2); }

    /* Interactive Stage (Living Book Canvas) */
    #stage {
      flex: 1; position: relative; overflow: hidden;
      transition: background 0.6s ease;
    }

    /* Living Scenery Props */
    .prop {
      position: absolute; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
    }
    .prop-art {
      font-size: 88px; line-height: 1;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.18));
    }
    .prop-label {
      margin-top: 4px; background: rgba(255,255,255,0.9);
      padding: 4px 12px; border-radius: 16px; font-size: 15px;
      font-weight: 700; color: #1D3557; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      opacity: 0.9;
    }
    .prop.bounce { animation: propBounce 0.6s ease; }
    .prop.spin   { animation: propSpin 0.7s ease; }
    .prop.shake  { animation: propShake 0.5s ease; }
    .prop.float  { animation: propFloat 3s ease-in-out infinite; }

    @keyframes propBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-45px) scale(1.22); }
      70% { transform: translateY(-10px) scale(0.95); }
    }
    @keyframes propSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.3); }
      100% { transform: rotate(360deg) scale(1); }
    }
    @keyframes propShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-18px) rotate(-8deg); }
      75% { transform: translateX(18px) rotate(8deg); }
    }
    @keyframes propFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }

    /* Floating speech/sound bubble when a prop is tapped */
    .fx-bubble {
      position: absolute; z-index: 40; pointer-events: none;
      background: #fff; color: #1D3557; border: 4px solid #FF9F1C;
      padding: 8px 18px; border-radius: 28px; font-size: 24px; font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      animation: floatUp 1.1s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.6); opacity: 1; }
      40% { transform: translateY(-30px) scale(1.1); opacity: 1; }
      100% { transform: translateY(-65px) scale(1); opacity: 0; }
    }

    /* Gear Picker Overlay (Page 2 Choose Your Own Adventure) */
    .gear-tray {
      position: absolute; top: 52%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.95); border: 6px solid #FFD166;
      border-radius: 36px; padding: 22px 32px; z-index: 30;
      text-align: center; box-shadow: 0 18px 40px rgba(0,0,0,0.25);
    }
    .gear-title { font-size: 24px; color: #1D3557; margin-bottom: 14px; font-weight: 700; }
    .gear-grid { display: flex; gap: 18px; justify-content: center; }
    .gear-card {
      background: #F5FAFF; border: 4px solid #BDE0FE; border-radius: 24px;
      padding: 14px 20px; width: 140px; cursor: pointer; transition: all 0.2s;
    }
    .gear-card.selected {
      background: #D8F3DC; border-color: #06D6A0; transform: translateY(-6px) scale(1.05);
      box-shadow: 0 8px 20px rgba(6,214,160,0.35);
    }
    .gear-icon { font-size: 54px; margin-bottom: 6px; }
    .gear-name { font-size: 17px; font-weight: 700; color: #1D3557; }

    /* Bottom Storybook Text & Controls Bar */
    footer {
      background: #fff; border-top: 6px solid #FFD166;
      padding: 18px 32px; display: flex; align-items: center;
      justify-content: space-between; gap: 24px; z-index: 50;
      min-height: 148px; box-shadow: 0 -10px 30px rgba(0,0,0,0.12);
    }
    .nav-arrow {
      background: #4EA8DE; color: #fff; border: none;
      width: 68px; height: 68px; border-radius: 50%; font-size: 32px;
      font-weight: 700; cursor: pointer; box-shadow: 0 6px 0 #1D3557;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: transform 0.1s;
    }
    .nav-arrow:active { transform: translateY(4px); box-shadow: 0 2px 0 #1D3557; }
    .nav-arrow:disabled { background: #CBD5E1; box-shadow: none; cursor: not-allowed; opacity: 0.5; }

    .story-center {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .read-controls {
      display: flex; align-items: center; gap: 12px;
    }
    .read-btn {
      background: #06D6A0; color: #fff; border: none;
      padding: 8px 22px; border-radius: 30px; font-family: inherit;
      font-size: 18px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 0 #049A72; display: flex; align-items: center; gap: 8px;
    }
    .read-btn.playing { background: #FF9F1C; box-shadow: 0 4px 0 #CC7A00; }
    .page-indicator { font-size: 16px; font-weight: 700; color: #6C757D; }

    /* Interactive Word-by-Word Sentence Box */
    .sentence-box {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 10px 12px; max-width: 920px; line-height: 1.35;
    }
    .story-word {
      font-size: 32px; font-weight: 700; color: #1D3557;
      padding: 4px 10px; border-radius: 14px; cursor: pointer;
      transition: all 0.15s ease; border: 3px solid transparent;
    }
    .story-word:hover { background: #E2F1FF; }
    /* Active Highlight synced to ElevenLabs Timestamp! */
    .story-word.highlight {
      background: #FFE66D; color: #D62828; border-color: #FF9F1C;
      transform: scale(1.14) translateY(-4px);
      box-shadow: 0 6px 14px rgba(255, 159, 28, 0.35);
    }
  </style>

    // =========================================================================
    // ELEVENLABS TIMESTAMP CONVERTER
    // Supports BOTH word-level arrays AND raw ElevenLabs character `alignment` JSON!
    // =========================================================================
    function parseElevenLabsAlignment(alignment) {
      // If already a word array: [{ word: "Wyatt", start: 0.0, end: 0.42 }, ...]
      if (Array.isArray(alignment)) return alignment;

      // Convert ElevenLabs raw character alignment:
      // { characters: [...], character_start_times_seconds: [...], character_end_times_seconds: [...] }
      const chars = alignment.characters || [];
      const starts = alignment.character_start_times_seconds || [];
      const ends = alignment.character_end_times_seconds || [];
      const words = [];
      let currentWord = '';
      let wordStart = null;
      let wordEnd = null;

      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];
        if (ch === ' ' || ch === '\n') {
          if (currentWord.length > 0) {
            words.push({ word: currentWord, start: wordStart, end: wordEnd });
            currentWord = '';
            wordStart = null;
          }
        } else {
          if (wordStart === null) wordStart = starts[i];
          wordEnd = ends[i];
          currentWord += ch;
        }
      }
      if (currentWord.length > 0) {
        words.push({ word: currentWord, start: wordStart, end: wordEnd });
      }
      return words;
    }

    const audioEl = document.getElementById('page-audio');

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // Rich Synthesized Sound Effects for Living Book Props & Demo Word Plucks
    function playSoundFX(type, customFreq) {
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'word-pluck') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(customFreq || 523.25, now);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      } else if (type === 'magic' || type === 'harp') {
        const notes = type === 'harp' ? [523, 659, 784, 1046, 1318] : [587, 784, 987, 1174];
        notes.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + i * 0.06);
          gain.gain.setValueAtTime(0.25, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 0.3);
        });
      } else if (type === 'moo') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.linearRampToValueAtTime(95, now + 0.45);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'jump' || type === 'hoot') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(620, now + 0.22);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.24);
      } else {
        // Default cheerful chime
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(659.25, now);
        osc.frequency.setValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      }
    }

    function renderBackpack() {
      for (let i = 0; i < 2; i++) {
        const slot = document.getElementById(`slot-${i}`);
        const gearObj = gearCatalog.find(g => g.id === packedGear[i]);
        if (gearObj) {
          slot.textContent = gearObj.icon;
          slot.classList.add('filled');
        } else {
          slot.textContent = '❔';
          slot.classList.remove('filled');
        }
      }
    }

    function usePackedGear(slotIdx) {
      const gearObj = gearCatalog.find(g => g.id === packedGear[slotIdx]);
      if (!gearObj) return;
      playSoundFX('magic');
      spawnBubble(window.innerWidth / 2 - 80, 90, `${gearObj.icon} ${gearObj.msg}`);
    }

    function spawnBubble(x, y, text) {
      const b = document.createElement('div');
      b.className = 'fx-bubble';
      b.style.left = typeof x === 'number' ? `${x}px` : x;
      b.style.top = typeof y === 'number' ? `${y}px` : y;
      b.textContent = text;
      document.getElementById('stage').appendChild(b);
      setTimeout(() => b.remove(), 1100);
    }

    function renderPage() {
      stopNarration();
      const page = pages[currentPage];
      const stage = document.getElementById('stage');
      stage.style.background = page.bg;
      stage.innerHTML = '';

      document.getElementById('page-num').textContent = `Page ${currentPage + 1} of ${pages.length}`;
      document.getElementById('prev-btn').disabled = currentPage === 0;
      document.getElementById('next-btn').disabled = currentPage === pages.length - 1;

      // Render Interactive Props
      const propsToRender = [...page.props];

      // On Page 4 (Castle Page), add the kid's Chosen Adventure Gear right into the scene!
      if (page.isCastlePage) {
        packedGear.forEach((gId, idx) => {
          const g = gearCatalog.find(item => item.id === gId);
          if (g) {
            propsToRender.push({
              icon: g.icon,
              label: `Use ${g.name}!`,
              x: idx === 0 ? '48%' : '68%',
              y: '62%',
              anim: 'spin',
              msg: g.msg,
              sound: 'magic'
            });
          }
        });
      }

      propsToRender.forEach(p => {
        const el = document.createElement('div');
        el.className = 'prop';
        el.style.left = p.x;
        el.style.top = p.y;
        el.innerHTML = `
          <div class="prop-art">${p.icon}</div>
          <div class="prop-label">${p.label}</div>
        `;
        el.onclick = () => {
          el.classList.remove(p.anim);
          void el.offsetWidth;
          el.classList.add(p.anim);
          playSoundFX(p.sound);
          spawnBubble(p.x, p.y, p.msg);
        };
        stage.appendChild(el);
      });

      // On Page 2, show the Choose-Your-Own-Gear selector tray
      if (page.isGearPage) {
        const tray = document.createElement('div');
        tray.className = 'gear-tray';
        tray.innerHTML = `<div class="gear-title">🎒 Tap 2 Items to Pack for the Climb!</div><div class="gear-grid" id="gear-grid"></div>`;
        stage.appendChild(tray);
        renderGearChoices();
      }

      // Render Word-by-Word Sentence with Timestamp Hooks
      const sentenceBox = document.getElementById('sentence-box');
      sentenceBox.innerHTML = '';
      const words = parseElevenLabsAlignment(page.words);

      words.forEach((wObj, idx) => {
        const span = document.createElement('span');
        span.className = 'story-word';
        span.id = `word-${idx}`;
        span.textContent = wObj.word;
        // Tap any single word to slice & play just that word's timestamp!
        span.onclick = () => playSingleWord(idx, wObj);
        sentenceBox.appendChild(span);
      });

      // Point audio player to this page's ElevenLabs MP3
      audioEl.src = page.audioUrl;
      renderBackpack();
    }

    function renderGearChoices() {
      const grid = document.getElementById('gear-grid');
      if (!grid) return;
      grid.innerHTML = '';
      gearCatalog.forEach(g => {
        const isSelected = packedGear.includes(g.id);
        const card = document.createElement('div');
        card.className = 'gear-card' + (isSelected ? ' selected' : '');
        card.innerHTML = `<div class="gear-icon">${g.icon}</div><div class="gear-name">${g.name}</div>`;
        card.onclick = () => {
          if (packedGear.includes(g.id)) {
            if (packedGear.length > 1) packedGear = packedGear.filter(id => id !== g.id);
          } else {
            if (packedGear.length >= 2) packedGear.shift();
            packedGear.push(g.id);
          }
          playSoundFX('chime');
          renderBackpack();
          renderGearChoices();
        };
        grid.appendChild(card);
      });
    }

    // Highlight word by index
    function highlightWord(idx) {
      document.querySelectorAll('.story-word').forEach((el, i) => {
        el.classList.toggle('highlight', i === idx);
      });
    }

    function stopNarration() {
      isPlaying = false;
      demoTimers.forEach(t => clearTimeout(t));
      demoTimers = [];
      audioEl.pause();
      if (wordStopHandler) {
        audioEl.removeEventListener('timeupdate', wordStopHandler);
        wordStopHandler = null;
      }
      highlightWord(-1);
      const btn = document.getElementById('read-btn');
      if (btn) {
        btn.classList.remove('playing');
        btn.innerHTML = '🔊 Read to Me';
      }
    }

    // Plays the full page using ElevenLabs MP3 + Timestamps (or Demo Visual Sync if MP3 isn't uploaded yet)
    function playPageNarration() {
      if (isPlaying) {
        stopNarration();
        return;
      }
      stopNarration();
      isPlaying = true;
      const btn = document.getElementById('read-btn');
      btn.classList.add('playing');
      btn.innerHTML = '⏹️ Reading...';

      const words = parseElevenLabsAlignment(pages[currentPage].words);

      audioEl.currentTime = 0;
      audioEl.play().then(() => {
        // Real ElevenLabs MP3 is playing! Sync highlights via requestAnimationFrame / timeupdate
        const syncLoop = () => {
          if (!isPlaying) return;
          const t = audioEl.currentTime;
          const activeIdx = words.findIndex(w => t >= w.start && t <= w.end);
          highlightWord(activeIdx);
          if (!audioEl.paused && !audioEl.ended) {
            requestAnimationFrame(syncLoop);
          }
        };
        requestAnimationFrame(syncLoop);
        audioEl.onended = () => stopNarration();
      }).catch(() => {
        // Fallback Demo Mode when MP3 file isn't in GitHub yet:
        // Steps through exact ElevenLabs timestamps with a gentle marimba pluck!
        const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33];
        words.forEach((w, idx) => {
          const t1 = setTimeout(() => {
            highlightWord(idx);
            playSoundFX('word-pluck', scale[idx % scale.length]);
          }, w.start * 1000);
          demoTimers.push(t1);
        });
        const lastEnd = words[words.length - 1].end;
        const tEnd = setTimeout(() => stopNarration(), lastEnd * 1000 + 250);
        demoTimers.push(tEnd);
      });
    }

    // Slices a single word out of the page's ElevenLabs MP3 using its start/end timestamps!
    function playSingleWord(idx, wObj) {
      stopNarration();
      highlightWord(idx);

      audioEl.currentTime = wObj.start;
      audioEl.play().then(() => {
        wordStopHandler = () => {
          if (audioEl.currentTime >= wObj.end) {
            audioEl.pause();
            audioEl.removeEventListener('timeupdate', wordStopHandler);
            highlightWord(-1);
          }
        };
        audioEl.addEventListener('timeupdate', wordStopHandler);
      }).catch(() => {
        // If MP3 isn't uploaded yet, play gentle chime and highlight for the exact duration of the word
        playSoundFX('chime');
        setTimeout(() => highlightWord(-1), Math.max(400, (wObj.end - wObj.start) * 1000));
      });
    }

    function changePage(dir) {
      const next = currentPage + dir;
      if (next < 0 || next >= pages.length) return;
      playSoundFX('chime');
      currentPage = next;
      renderPage();
    }

    renderPage();
  </script>
</body>
</html>
