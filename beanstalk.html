<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wyatt, Emma & the Magic Beanstalk</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    html, body {
      font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
      height: 100%; width: 100%; overflow: hidden;
      background: #1D3557;
      touch-action: manipulation;
    }

    #stage-wrap {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: 16px 24px 20px;
      transition: background 0.6s ease;
      background: linear-gradient(180deg, #70D6FF 0%, #BDE0FE 58%, #8AC926 58%, #52B788 100%);
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      z-index: 60; flex-shrink: 0;
    }
    .hud-btn, .backpack-bar {
      background: rgba(255,255,255,0.95); border: 4px solid #fff;
      padding: 8px 20px; border-radius: 40px; font-size: 19px; font-weight: 700;
      color: #1D3557; box-shadow: 0 6px 16px rgba(0,0,0,0.16);
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      text-decoration: none;
    }
    .backpack-bar { background: #FFD166; padding: 6px 18px; }
    .pack-slot {
      width: 40px; height: 40px; border-radius: 50%;
      background: #fff; border: 2px solid #1D3557;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; cursor: pointer;
    }

    .story-card {
      position: relative; z-index: 50;
      background: #FFFDF7;
      border: 6px solid #FFD166;
      border-radius: 32px;
      padding: 16px 24px;
      max-width: 1050px; width: 100%;
      margin: 8px auto 0;
      box-shadow: 0 12px 32px rgba(0,0,0,0.22);
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      flex-shrink: 0;
    }
    .nav-arrow {
      background: #4EA8DE; color: #fff; border: none;
      width: 60px; height: 60px; border-radius: 50%; font-size: 28px;
      font-weight: 700; cursor: pointer; box-shadow: 0 5px 0 #1D3557;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: transform 0.1s;
    }
    .nav-arrow:active { transform: translateY(3px); box-shadow: 0 2px 0 #1D3557; }
    .nav-arrow:disabled { background: #CBD5E1; box-shadow: none; cursor: not-allowed; opacity: 0.45; }

    .story-content {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .story-toolbar {
      display: flex; align-items: center; gap: 14px;
    }
    .read-btn {
      background: #06D6A0; color: #fff; border: none;
      padding: 7px 22px; border-radius: 30px; font-family: inherit;
      font-size: 18px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 0 #049A72; display: flex; align-items: center; gap: 8px;
    }
    .read-btn.playing { background: #FF9F1C; box-shadow: 0 4px 0 #CC7A00; }
    .page-indicator {
      font-size: 15px; font-weight: 700; color: #457B9D;
      background: #E2F1FF; padding: 5px 14px; border-radius: 20px;
    }

    .sentence-box {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 6px 8px; line-height: 1.35; text-align: center;
    }
    .story-word {
      font-size: 27px; font-weight: 700; color: #1D3557;
      padding: 3px 8px; border-radius: 12px; cursor: pointer;
      transition: all 0.12s ease; border: 3px solid transparent;
    }
    .story-word:hover { background: #E2F1FF; }
    .story-word.highlight {
      background: #FFE66D; color: #D62828; border-color: #FF9F1C;
      transform: scale(1.14) translateY(-3px);
      box-shadow: 0 6px 14px rgba(255, 159, 28, 0.35);
    }

    #stage {
      flex: 1; position: relative; width: 100%;
    }

    .prop {
      position: absolute; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }
    .prop-art {
      font-size: 86px; line-height: 1;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.2));
    }
    .prop-label {
      margin-top: 4px; background: rgba(255,255,255,0.92);
      padding: 4px 12px; border-radius: 16px; font-size: 15px;
      font-weight: 700; color: #1D3557; box-shadow: 0 4px 8px rgba(0,0,0,0.12);
    }
    .prop.bounce { animation: propBounce 0.6s ease; }
    .prop.spin   { animation: propSpin 0.7s ease; }
    .prop.shake  { animation: propShake 0.5s ease; }

    @keyframes propBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-40px) scale(1.22); }
      70% { transform: translateY(-10px) scale(0.95); }
    }
    @keyframes propSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.3); }
      100% { transform: rotate(360deg) scale(1); }
    }
    @keyframes propShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-16px) rotate(-8deg); }
      75% { transform: translateX(16px) rotate(8deg); }
    }

    .fx-bubble {
      position: absolute; z-index: 80; pointer-events: none;
      background: #fff; color: #1D3557; border: 4px solid #FF9F1C;
      padding: 8px 18px; border-radius: 28px; font-size: 22px; font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22);
      animation: floatUp 1.1s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.6); opacity: 1; }
      40% { transform: translateY(-25px) scale(1.08); opacity: 1; }
      100% { transform: translateY(-55px) scale(1); opacity: 0; }
    }

    .gear-tray {
      position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.96); border: 6px solid #FFD166;
      border-radius: 32px; padding: 18px 28px; z-index: 40;
      text-align: center; box-shadow: 0 18px 40px rgba(0,0,0,0.28);
    }
    .gear-title { font-size: 22px; color: #1D3557; margin-bottom: 12px; font-weight: 700; }
    .gear-grid { display: flex; gap: 14px; justify-content: center; }
    .gear-card {
      background: #F5FAFF; border: 4px solid #BDE0FE; border-radius: 22px;
      padding: 10px 16px; width: 130px; cursor: pointer; transition: all 0.2s;
    }
    .gear-card.selected {
      background: #D8F3DC; border-color: #06D6A0; transform: translateY(-5px);
      box-shadow: 0 8px 18px rgba(6,214,160,0.35);
    }
    .gear-icon { font-size: 46px; margin-bottom: 4px; }
    .gear-name { font-size: 16px; font-weight: 700; color: #1D3557; }
  </style>
</head>
<body>

  <div id="stage-wrap">
    <header>
      <a href="index.html" class="hud-btn">🏠 Library</a>
      <div class="backpack-bar">
        🎒 Adventure Gear:
        <div class="pack-slot" id="slot-0" onclick="usePackedGear(0)">🔦</div>
        <div class="pack-slot" id="slot-1" onclick="usePackedGear(1)">🌻</div>
      </div>
    </header>

    <div class="story-card">
      <button class="nav-arrow" id="prev-btn" onclick="changePage(-1)">◀</button>

      <div class="story-content">
        <div class="story-toolbar">
          <button class="read-btn" id="read-btn" onclick="playPageNarration()">🔊 Read to Me</button>
          <span class="page-indicator" id="page-num">Page 1 of 5 • Tap any word or picture!</span>
        </div>
        <div class="sentence-box" id="sentence-box"></div>
      </div>

      <button class="nav-arrow" id="next-btn" onclick="changePage(1)">▶</button>
    </div>

    <div id="stage"></div>
  </div>

  <audio id="page-audio" preload="auto"></audio>

  <script>
    // =========================================================================
    // SMART NATURAL READING SPEED PACER
    // Automatically scales word timings to match your ElevenLabs MP3 duration,
    // including natural storyteller pauses for commas and exclamation marks!
    // =========================================================================
    function generateNaturalWordTimings(text, totalAudioDuration) {
      const rawWords = text.trim().split(/\s+/);

      // Estimate each word's speaking weight + punctuation pause weight
      const weights = rawWords.map(w => {
        const cleanLen = w.replace(/[^a-zA-Z]/g, '').length || 2;
        // Spoken duration weight based on word length
        let speakWeight = 1.0 + (cleanLen * 0.22);
        // Natural storyteller pause after punctuation
        let pauseWeight = 0.08;
        if (w.endsWith(',')) pauseWeight = 0.75;
        else if (w.endsWith('!') || w.endsWith('.')) pauseWeight = 1.35;
        return { word: w, speakWeight, pauseWeight, total: speakWeight + pauseWeight };
      });

      const sumWeights = weights.reduce((acc, item) => acc + item.total, 0);

      // Leave a tiny lead-in (0.08s) and tail buffer (0.15s) to match ElevenLabs MP3s
      const targetSpan = totalAudioDuration
        ? Math.max(1.5, totalAudioDuration - 0.22)
        : sumWeights * 0.23; // ~155 WPM natural children's book pace if no MP3

      const scale = targetSpan / sumWeights;
      let cursor = 0.08;

      return weights.map(item => {
        const start = Number(cursor.toFixed(2));
        const speakDuration = item.speakWeight * scale;
        const end = Number((start + speakDuration).toFixed(2));
        cursor += item.total * scale;
        return { word: item.word, start, end };
      });
    }

    const gearCatalog = [
      { id: 'flashlight', icon: '🔦', name: 'Flashlight', msg: 'FLASH! Super bright beam!', freq: 880 },
      { id: 'dino',       icon: '🦖', name: 'Toy Dino',   msg: 'ROOOAR! Dino power!', freq: 180 },
      { id: 'wand',       icon: '🌻', name: 'Sunflower Wand', msg: '✨ Sparkle Magic! ✨', freq: 1046 },
      { id: 'cookie',     icon: '🍪', name: 'Giant Cookie', msg: 'CRUNCH! Yum yum!', freq: 440 }
    ];
    let packedGear = ['flashlight', 'wand'];

    const pages = [
      {
        bg: 'linear-gradient(180deg, #70D6FF 0%, #BDE0FE 58%, #8AC926 58%, #52B788 100%)',
        fileBase: 'beanstalk-p1.mp3',
        text: "One sunny morning, Wyatt and Emma traded their silly spotted cow for five magic glowing beans! They planted them right beside the garden fence.",
        props: [
          { icon: '🏡', label: 'Family Cottage', x: '10%', y: '22%', anim: 'shake', msg: 'Knock knock! Time for an adventure!', sound: 'knock' },
          { icon: '🐄', label: 'Daisy the Cow', x: '34%', y: '32%', anim: 'bounce', msg: 'MOOOOO! Good luck with those beans! 🥛', sound: 'moo' },
          { icon: '👦🏻', label: 'Wyatt', x: '58%', y: '35%', anim: 'bounce', msg: 'Whoa! Look how shiny they are!', sound: 'jump' },
          { icon: '👧🏻', label: 'Emma', x: '74%', y: '38%', anim: 'bounce', msg: 'Let\'s plant them right here! ✨', sound: 'chime' },
          { icon: '🫘', label: 'Magic Beans', x: '48%', y: '60%', anim: 'spin', msg: '✨ ZZZAP! Magic Bean Power! ✨', sound: 'magic' }
        ]
      },
      {
        bg: 'linear-gradient(180deg, #1D3557 0%, #457B9D 58%, #2D6A4F 58%, #1B4332 100%)',
        fileBase: 'beanstalk-p2.mp3',
        isGearPage: true,
        text: "That night while the moon shone bright, a giant green beanstalk sprouted all the way into the clouds! Pick two items to pack in your backpack before you climb!",
        props: [
          { icon: '🌙', label: 'Sleepy Moon', x: '8%', y: '10%', anim: 'spin', msg: 'Yaaaawn! Have a safe climb!', sound: 'chime' },
          { icon: '🌱', label: 'Giant Stalk', x: '84%', y: '28%', anim: 'bounce', msg: 'SPROING! Growing higher and higher!', sound: 'jump' },
          { icon: '🦉', label: 'Night Owl', x: '12%', y: '52%', anim: 'bounce', msg: 'HOO-HOO! Pack your best gear!', sound: 'hoot' }
        ]
      },
      {
        bg: 'linear-gradient(180deg, #48CAE4 0%, #90E0EF 50%, #CAF0F8 100%)',
        fileBase: 'beanstalk-p3.mp3',
        text: "Up, up, up they climbed! Higher than the tallest trees and right through the fluffy white clouds until they saw a glittering road in the sky.",
        props: [
          { icon: '🌿', label: 'Giant Vine', x: '46%', y: '15%', anim: 'shake', msg: 'Rustle rustle! Big leafy steps!', sound: 'jump' },
          { icon: '🌿', label: 'Leafy Step', x: '46%', y: '55%', anim: 'shake', msg: 'Hold on tight!', sound: 'jump' },
          { icon: '👦🏻', label: 'Wyatt Climbing', x: '34%', y: '25%', anim: 'bounce', msg: 'I can see our backyard from way up here!', sound: 'chime' },
          { icon: '👧🏻', label: 'Emma Climbing', x: '58%', y: '42%', anim: 'bounce', msg: 'The clouds feel like cotton candy!', sound: 'chime' },
          { icon: '☁️', label: 'Tickle Cloud', x: '14%', y: '30%', anim: 'bounce', msg: '⚡ PFFFT! Fluffy cloud puff!', sound: 'magic' },
          { icon: '🌈', label: 'Sky Rainbow', x: '78%', y: '20%', anim: 'spin', msg: '✨ Sliding across the sky! ✨', sound: 'harp' }
        ]
      },
      {
        bg: 'linear-gradient(180deg, #CDB4DB 0%, #FFC8DD 58%, #FFAFCC 100%)',
        fileBase: 'beanstalk-p4.mp3',
        isCastlePage: true,
        text: "At the top stood a tremendous Cloud Castle! Inside, a sleepy Giant snored loudly at his table beside a singing Golden Harp and a friendly Golden Goose. Tap your packed gear to use it!",
        props: [
          { icon: '🏰', label: 'Cloud Castle', x: '10%', y: '22%', anim: 'shake', msg: 'BOOM! Everything inside is huge!', sound: 'moo' },
          { icon: '🧔‍♂️', label: 'Sleepy Giant', x: '32%', y: '28%', anim: 'bounce', msg: 'FEE-FI-FO-FUM... Zzzzzzz! 💤', sound: 'moo' },
          { icon: '🪿', label: 'Golden Goose', x: '58%', y: '30%', anim: 'bounce', msg: 'HONK! Take me home with you! 🥚✨', sound: 'magic' },
          { icon: '🪕', label: 'Magic Harp', x: '80%', y: '26%', anim: 'spin', msg: '🎵 Pluck! Pluck! Lullaby for the Giant! 🎵', sound: 'harp' }
        ]
      },
      {
        bg: 'linear-gradient(180deg, #90E0EF 0%, #D8F3DC 58%, #52B788 58%, #40916C 100%)',
        fileBase: 'beanstalk-p5.mp3',
        text: "With a wiggle and a giggle, Wyatt and Emma zoomed all the way down the beanstalk right into Dad's arms! The Golden Goose honked happily, and they all had golden pancakes for dinner!",
        props: [
          { icon: '👨🏻', label: 'Dad', x: '18%', y: '35%', anim: 'bounce', msg: 'Welcome back, my brave explorers! 🏆', sound: 'harp' },
          { icon: '👦🏻', label: 'Wyatt', x: '40%', y: '40%', anim: 'bounce', msg: 'Dad! You won\'t believe what was in the clouds!', sound: 'jump' },
          { icon: '👧🏻', label: 'Emma', x: '56%', y: '42%', anim: 'bounce', msg: 'We brought home a new friend!', sound: 'chime' },
          { icon: '🪿', label: 'Golden Goose', x: '76%', y: '36%', anim: 'spin', msg: '🥚✨ Golden pancakes for everyone!', sound: 'magic' }
        ]
      }
    ];

    let currentPage = 0;
    let currentWords = [];
    let audioCtx = null;
    let demoTimers = [];
    let isPlaying = false;
    let wordStopHandler = null;

    const audioEl = document.getElementById('page-audio');

    // Automatically recalculate exact word timings as soon as the ElevenLabs MP3 loads its duration!
    audioEl.addEventListener('loadedmetadata', () => {
      if (audioEl.duration && isFinite(audioEl.duration)) {
        currentWords = generateNaturalWordTimings(pages[currentPage].text, audioEl.duration);
        bindWordClicks();
      }
    });

    // If root `beanstalk-p1.mp3` isn't found, automatically check `audio/beanstalk-p1.mp3`!
    audioEl.addEventListener('error', () => {
      const page = pages[currentPage];
      if (audioEl.src && !audioEl.src.includes('/audio/')) {
        audioEl.src = 'audio/' + page.fileBase;
      }
    });

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSoundFX(type, customFreq) {
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'word-pluck') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(customFreq || 523.25, now);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      } else if (type === 'magic' || type === 'harp') {
        const notes = type === 'harp' ? [523, 659, 784, 1046, 1318] : [587, 784, 987, 1174];
        notes.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + i * 0.06);
          gain.gain.setValueAtTime(0.25, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 0.3);
        });
      } else if (type === 'moo') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.linearRampToValueAtTime(95, now + 0.45);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'jump' || type === 'hoot') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(620, now + 0.22);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.24);
      } else {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(659.25, now);
        osc.frequency.setValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      }
    }

    function renderBackpack() {
      for (let i = 0; i < 2; i++) {
        const slot = document.getElementById(`slot-${i}`);
        const gearObj = gearCatalog.find(g => g.id === packedGear[i]);
        if (gearObj) slot.textContent = gearObj.icon;
      }
    }

    function usePackedGear(slotIdx) {
      const gearObj = gearCatalog.find(g => g.id === packedGear[slotIdx]);
      if (!gearObj) return;
      playSoundFX('magic');
      spawnBubble('42%', '20%', `${gearObj.icon} ${gearObj.msg}`);
    }

    function spawnBubble(x, y, text) {
      const b = document.createElement('div');
      b.className = 'fx-bubble';
      b.style.left = typeof x === 'number' ? `${x}px` : x;
      b.style.top = typeof y === 'number' ? `${y}px` : y;
      b.textContent = text;
      document.getElementById('stage').appendChild(b);
      setTimeout(() => b.remove(), 1100);
    }

    function bindWordClicks() {
      const sentenceBox = document.getElementById('sentence-box');
      sentenceBox.innerHTML = '';
      currentWords.forEach((wObj, idx) => {
        const span = document.createElement('span');
        span.className = 'story-word';
        span.id = `word-${idx}`;
        span.textContent = wObj.word;
        span.onclick = () => playSingleWord(idx, wObj);
        sentenceBox.appendChild(span);
      });
    }

    function renderPage() {
      stopNarration();
      const page = pages[currentPage];
      const stageWrap = document.getElementById('stage-wrap');
      const stage = document.getElementById('stage');
      stageWrap.style.background = page.bg;
      stage.innerHTML = '';

      document.getElementById('page-num').textContent = `Page ${currentPage + 1} of ${pages.length} • Tap any word or picture!`;
      document.getElementById('prev-btn').disabled = currentPage === 0;
      document.getElementById('next-btn').disabled = currentPage === pages.length - 1;

      const propsToRender = [...page.props];

      if (page.isCastlePage) {
        packedGear.forEach((gId, idx) => {
          const g = gearCatalog.find(item => item.id === gId);
          if (g) {
            propsToRender.push({
              icon: g.icon,
              label: `Use ${g.name}!`,
              x: idx === 0 ? '42%' : '64%',
              y: '60%',
              anim: 'spin',
              msg: g.msg,
              sound: 'magic'
            });
          }
        });
      }

      propsToRender.forEach(p => {
        const el = document.createElement('div');
        el.className = 'prop';
        el.style.left = p.x;
        el.style.top = p.y;
        el.innerHTML = `
          <div class="prop-art">${p.icon}</div>
          <div class="prop-label">${p.label}</div>
        `;
        el.onclick = () => {
          el.classList.remove(p.anim);
          void el.offsetWidth;
          el.classList.add(p.anim);
          playSoundFX(p.sound);
          spawnBubble(p.x, p.y, p.msg);
        };
        stage.appendChild(el);
      });

      if (page.isGearPage) {
        const tray = document.createElement('div');
        tray.className = 'gear-tray';
        tray.innerHTML = `<div class="gear-title">🎒 Tap 2 Items to Pack for the Climb!</div><div class="gear-grid" id="gear-grid"></div>`;
        stage.appendChild(tray);
        renderGearChoices();
      }

      // Generate initial natural timings (will refine automatically once MP3 metadata loads)
      currentWords = generateNaturalWordTimings(page.text, null);
      bindWordClicks();

      // Try root path first (e.g., `beanstalk-p1.mp3`), fallback handler checks `audio/beanstalk-p1.mp3`
      audioEl.src = page.fileBase;
      renderBackpack();
    }

    function renderGearChoices() {
      const grid = document.getElementById('gear-grid');
      if (!grid) return;
      grid.innerHTML = '';
      gearCatalog.forEach(g => {
        const isSelected = packedGear.includes(g.id);
        const card = document.createElement('div');
        card.className = 'gear-card' + (isSelected ? ' selected' : '');
        card.innerHTML = `<div class="gear-icon">${g.icon}</div><div class="gear-name">${g.name}</div>`;
        card.onclick = () => {
          if (packedGear.includes(g.id)) {
            if (packedGear.length > 1) packedGear = packedGear.filter(id => id !== g.id);
          } else {
            if (packedGear.length >= 2) packedGear.shift();
            packedGear.push(g.id);
          }
          playSoundFX('chime');
          renderBackpack();
          renderGearChoices();
        };
        grid.appendChild(card);
      });
    }

    function highlightWord(idx) {
      document.querySelectorAll('.story-word').forEach((el, i) => {
        el.classList.toggle('highlight', i === idx);
      });
    }

    function stopNarration() {
      isPlaying = false;
      demoTimers.forEach(t => clearTimeout(t));
      demoTimers = [];
      audioEl.pause();
      if (wordStopHandler) {
        audioEl.removeEventListener('timeupdate', wordStopHandler);
        wordStopHandler = null;
      }
      highlightWord(-1);
      const btn = document.getElementById('read-btn');
      if (btn) {
        btn.classList.remove('playing');
        btn.innerHTML = '🔊 Read to Me';
      }
    }

    function playPageNarration() {
      if (isPlaying) {
        stopNarration();
        return;
      }
      stopNarration();
      isPlaying = true;
      const btn = document.getElementById('read-btn');
      btn.classList.add('playing');
      btn.innerHTML = '⏹️ Reading...';

      audioEl.currentTime = 0;
      audioEl.play().then(() => {
        // Recalculate once more in case duration just became available
        if (audioEl.duration && isFinite(audioEl.duration)) {
          currentWords = generateNaturalWordTimings(pages[currentPage].text, audioEl.duration);
        }
        const syncLoop = () => {
          if (!isPlaying) return;
          const t = audioEl.currentTime;
          // Find the word whose window matches current audio time
          let activeIdx = currentWords.findIndex((w, i) => {
            const nextStart = currentWords[i + 1] ? currentWords[i + 1].start : w.end + 0.2;
            return t >= w.start && t < nextStart;
          });
          highlightWord(activeIdx);
          if (!audioEl.paused && !audioEl.ended) {
            requestAnimationFrame(syncLoop);
          }
        };
        requestAnimationFrame(syncLoop);
        audioEl.onended = () => stopNarration();
      }).catch(() => {
        // Fallback Demo Mode (for Pages 3-5 before MP3s are uploaded)
        const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33];
        currentWords.forEach((w, idx) => {
          const t1 = setTimeout(() => {
            highlightWord(idx);
            playSoundFX('word-pluck', scale[idx % scale.length]);
          }, w.start * 1000);
          demoTimers.push(t1);
        });
        const lastEnd = currentWords[currentWords.length - 1].end;
        const tEnd = setTimeout(() => stopNarration(), lastEnd * 1000 + 250);
        demoTimers.push(tEnd);
      });
    }

    function playSingleWord(idx, wObj) {
      stopNarration();
      highlightWord(idx);

      audioEl.currentTime = wObj.start;
      audioEl.play().then(() => {
        wordStopHandler = () => {
          if (audioEl.currentTime >= wObj.end) {
            audioEl.pause();
            audioEl.removeEventListener('timeupdate', wordStopHandler);
            highlightWord(-1);
          }
        };
        audioEl.addEventListener('timeupdate', wordStopHandler);
      }).catch(() => {
        playSoundFX('chime');
        setTimeout(() => highlightWord(-1), Math.max(400, (wObj.end - wObj.start) * 1000));
      });
    }

    function changePage(dir) {
      const next = currentPage + dir;
      if (next < 0 || next >= pages.length) return;
      playSoundFX('chime');
      currentPage = next;
      renderPage();
    }

    renderPage();
  </script>
</body>
</html>
