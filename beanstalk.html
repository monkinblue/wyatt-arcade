<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="theme-color" content="#1A103C">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
