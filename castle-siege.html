<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Castle Siege Artillery!</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="castle-siege.css">
</head>
<body>
  <div id="siege-app">
    <header>
      <div class="mode-group">
        <a href="index.html" class="nav-btn">🏠 Back</a>
        <button class="mode-btn" data-mode="duel">⚔️ Vs. Goblin AI</button>
        <button class="mode-btn" data-mode="puzzle">🎯 5-Shot Siege</button>
        <button class="mode-btn" data-mode="pass">👨‍👧 2P Duel</button>
      </div>

      <div class="wind-pill" id="wind-pill">🌬️ Wind: CALM</div>

      <div class="mode-group">
        <button class="world-btn" id="world-btn">🌍 Valley</button>
        <div class="turn-pill" id="status-pill">🏰 Wave 1</div>
      </div>
    </header>

    <main class="battle-wrap" id="battle-wrap">
      <div class="sky-toast" id="sky-toast">Destroy the 👹 Goblin King OR Enemy Cannon to Win!</div>
      <canvas id="siege-canvas" width="1280" height="620"></canvas>
    </main>

    <footer class="cockpit-bar">
      <div class="dial-box">
        <button class="step-btn" id="ang-minus">−</button>
        <div class="slider-col">
          <div class="slider-lbl"><span>📐 ANGLE</span><b id="ang-val">48°</b></div>
          <input type="range" id="ang-slider" min="10" max="85" value="48">
        </div>
        <button class="step-btn" id="ang-plus">+</button>
      </div>

      <div class="dial-box">
        <button class="step-btn" id="pwr-minus">−</button>
        <div class="slider-col">
          <div class="slider-lbl"><span>⚡ POWER</span><b id="pwr-val">62</b></div>
          <input type="range" id="pwr-slider" min="20" max="100" value="62">
        </div>
        <button class="step-btn" id="pwr-plus">+</button>
      </div>

      <div class="ammo-bar">
        <button class="ammo-btn active" data-ammo="heavy"><span>💣</span><span>Heavy</span></button>
        <button class="ammo-btn" data-ammo="cluster"><span>✨</span><span>Split x3</span><small id="cnt-cluster">3 left</small></button>
        <button class="ammo-btn" data-ammo="bouncer"><span>🏀</span><span>Bounce</span><small id="cnt-bouncer">3 left</small></button>
      </div>

      <button class="fire-btn" id="fire-btn">🔥 FIRE!</button>
    </footer>
  </div>

  <div id="siege-modal">
    <div class="modal-card">
      <div style="font-size:60px;" id="modal-icon">🏆💥🏰</div>
      <div style="font-size:36px;font-weight:700;color:#FDE047;" id="modal-title">VICTORY!</div>
      <div style="font-size:19px;color:#CBD5E1;" id="modal-sub">Enemy defenses obliterated!</div>
      <button class="fire-btn" id="next-wave-btn" style="padding:12px 34px;height:auto;">⚔️ Next Siege!</button>
    </div>
  </div>

  <script src="castle-physics.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const profile = params.get('kid') || localStorage.getItem('activeKid') || 'wyatt';
    const isEmma = profile === 'emma';

    // Fixed, crash-proof internal world resolution (1280x620) — never wipes canvas during resize!
    const W = 1280;
    const H = 620;
    const TIME_STEP = 0.44;  // Smooth slow-motion flight
    const SPEED_MUL = 0.228; // Plenty of range to easily reach back walls even into headwinds!

    const canvas = document.getElementById('siege-canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    function syncViewport() {
      const vv = window.visualViewport;
      const vw = Math.round(vv ? vv.width : document.documentElement.clientWidth || window.innerWidth);
      const vh = Math.round(vv ? vv.height : document.documentElement.clientHeight || window.innerHeight);
      if (vw > 0 && vh > 0) {
        document.documentElement.style.setProperty('--app-w', `${vw}px`);
        document.documentElement.style.setProperty('--app-h', `${vh}px`);
      }
    }
    window.addEventListener('resize', syncViewport);
    window.addEventListener('pageshow', syncViewport);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', syncViewport);
    [0, 80, 250, 600].forEach(ms => setTimeout(syncViewport, ms));

    const bgImg = new Image();
    let bgReady = false;
    const bgPaths = ['images/siege-bg.jpg', 'images/siege-bg.jpeg', 'images/siege-bg.png', 'siege-bg.jpg'];
    let bgIdx = 0;
    bgImg.onload = () => { bgReady = true; };
    bgImg.onerror = () => { bgIdx++; if (bgIdx < bgPaths.length) bgImg.src = bgPaths[bgIdx]; };
    bgImg.src = bgPaths[0];

    let mode = isEmma ? 'puzzle' : 'duel';
    let worldIdx = 0;
    let wave = 1;
    let activeTurn = 'left';
    let shotsLeft = 6;
    let wind = 0;
    let ground = null;
    let blocks = [];
    let targets = [];
    let projectiles = [];
    let particles = [];
    let popups = [];
    let windLeaves = Array.from({ length: 20 }, () => ({ x: Math.random() * W, y: Math.random() * 400 }));

    const playerState = {
      left:  { angle: 48, power: 62, ghost: [], ammo: { cluster: 3, bouncer: 3 } },
      right: { angle: 48, power: 62, ghost: [], ammo: { cluster: 3, bouncer: 3 } }
    };
    let selectedAmmo = 'heavy';
    let canSplitMidAir = false;
    let lastWinFlag = false;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBoom(freq = 110, dur = 0.35, type = 'sawtooth', vol = 0.26) {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, now);
        o.frequency.exponentialRampToValueAtTime(28, now + dur);
        g.gain.setValueAtTime(vol, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now); o.stop(now + dur);
      } catch (_) {}
    }

    function getCannonPos(side) {
      const x = side === 'left' ? 265 : W - 265;
      return { x, y: SiegeBuilder.groundAt(ground, x) - 12 };
    }

    function rollWind() {
      if (isEmma && wave === 1) {
        wind = 0;
      } else {
        const mph = Math.round((Math.random() - 0.5) * 10);
        wind = mph * 0.0032;
      }
      const mphDisp = Math.round(Math.abs(wind) / 0.0032);
      const arrow = wind > 0.001 ? '➡️' : (wind < -0.001 ? '⬅️' : '⏺️');
      document.getElementById('wind-pill').textContent = mphDisp === 0
        ? '🌬️ Wind: CALM (0)'
        : `🌬️ Wind: ${arrow} ${mphDisp} mph`;
    }

    function syncControlsUI() {
      const st = playerState[activeTurn];
      document.getElementById('ang-slider').value = st.angle;
      document.getElementById('ang-val').textContent = `${Math.round(st.angle)}°`;
      document.getElementById('pwr-slider').value = st.power;
      document.getElementById('pwr-val').textContent = Math.round(st.power);
      document.getElementById('cnt-cluster').textContent = `${st.ammo.cluster} left`;
      document.getElementById('cnt-bouncer').textContent = `${st.ammo.bouncer} left`;

      if (selectedAmmo !== 'heavy' && st.ammo[selectedAmmo] <= 0) selectedAmmo = 'heavy';
      document.querySelectorAll('.ammo-btn').forEach(b => b.classList.toggle('active', b.dataset.ammo === selectedAmmo));

      const statusEl = document.getElementById('status-pill');
      if (mode === 'puzzle') statusEl.textContent = `💣 ${shotsLeft} Shots • Wave ${wave}`;
      else if (mode === 'pass') statusEl.textContent = activeTurn === 'left' ? '🟢 P1 Left Turn' : '🔵 P2 Right Turn';
      else statusEl.textContent = activeTurn === 'left' ? `🟢 Your Turn • W${wave}` : '👹 Goblin Aiming...';
    }

    function setupBattle(resetWave = false) {
      if (resetWave) wave = 1;
      lastWinFlag = false;
      document.getElementById('siege-modal').style.display = 'none';
      projectiles = [];
      particles = [];
      popups = [];
      canSplitMidAir = false;
      activeTurn = 'left';
      shotsLeft = isEmma ? 7 : 6;

      playerState.left.ghost = [];
      playerState.right.ghost = [];
      playerState.left.ammo = { cluster: 3, bouncer: 3 };
      playerState.right.ammo = { cluster: 3, bouncer: 3 };
      selectedAmmo = 'heavy';

      ground = SiegeBuilder.createTerrain(W, H, wave);
      const hasTurrets = mode !== 'puzzle';
      const rightFort = SiegeBuilder.buildFortress('right', ground, W, wave, isEmma, hasTurrets);
      blocks = [...rightFort.blocks];
      targets = [...rightFort.targets];

      if (mode !== 'puzzle') {
        const leftFort = SiegeBuilder.buildFortress('left', ground, W, wave, isEmma, true);
        blocks.push(...leftFort.blocks);
        targets.push(...leftFort.targets);
      }

      rollWind();
      const fireBtn = document.getElementById('fire-btn');
      fireBtn.disabled = false;
      fireBtn.textContent = '🔥 FIRE!';
      fireBtn.classList.remove('split-ready');
      document.getElementById('sky-toast').textContent = mode === 'puzzle'
        ? '🎯 Smash the 👹 Goblin King (or blow up 🧨 TNT) to Win!'
        : '⚔️ Hit EITHER the Enemy Cannon 🎯 OR the 👹 Goblin King to Win!';
      syncControlsUI();
    }

    function addPopup(x, y, text, color = '#FDE047') {
      popups.push({ x, y, text, color, life: 48 });
    }

    function detonate(x, y, radius, dmg) {
      playBoom(radius > 42 ? 85 : 130, 0.36);
      document.body.classList.add('boom-shake');
      setTimeout(() => document.body.classList.remove('boom-shake'), 170);

      SiegeBuilder.carveCrater(ground, x, y, radius, H);

      for (let i = 0; i < 26; i++) {
        const a = Math.random() * Math.PI * 2, sp = 1.6 + Math.random() * 6;
        particles.push({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.8,
          color: ['#FDE047', '#F97316', '#EF4444', '#FFFFFF'][i % 4], life: 34 + Math.random() * 14
        });
      }

      const chainTNTs = [];
      for (let i = blocks.length - 1; i >= 0; i--) {
        const b = blocks[i];
        const bx = b.x + b.w / 2, by = b.y + b.h / 2;
        if (Math.hypot(bx - x, by - y) <= radius + 16) {
          b.hp -= dmg;
          if (b.hp <= 0) {
            blocks.splice(i, 1);
            if (b.mat === 'tnt') {
              addPopup(bx, by - 16, '🧨 BOOM!!', '#EF4444');
              chainTNTs.push({ x: bx, y: by });
            }
          }
        }
      }

      for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        if (Math.hypot(t.x - x, t.y - y) <= radius + t.r + 8) {
          t.hp -= dmg;
          if (t.hp <= 0) {
            addPopup(t.x, t.y - 20, t.kind === 'turret' ? '💥 CANNON DESTROYED!' : '👑 KING KO!', '#06D6A0');
            targets.splice(i, 1);
          } else {
            addPopup(t.x, t.y - 18, '💥 DIRECT HIT!', '#FDE047');
          }
        }
      }

      // Huge TNT Chain Blast wipes out nearby walls & bosses!
      chainTNTs.forEach(keg => setTimeout(() => detonate(keg.x, keg.y, 76, 4), 110));
    }

    function launchShot(side, angleDeg, power, ammoType) {
      const pos = getCannonPos(side);
      const launchRad = side === 'left' ? (angleDeg * Math.PI) / 180 : ((180 - angleDeg) * Math.PI) / 180;
      const speed = power * SPEED_MUL;

      playBoom(240, 0.2, 'triangle', 0.24);
      if (side === 'left' || mode === 'pass') playerState[side].ghost = [];

      projectiles.push({
        side, ammo: ammoType, age: 0,
        x: pos.x + Math.cos(launchRad) * 22,
        y: pos.y - Math.sin(launchRad) * 22,
        vx: Math.cos(launchRad) * speed,
        vy: -Math.sin(launchRad) * speed,
        bounces: ammoType === 'bouncer' ? 2 : 0,
        recordGhost: true
      });

      const fireBtn = document.getElementById('fire-btn');
      if (ammoType === 'cluster' && (side === 'left' || mode === 'pass')) {
        canSplitMidAir = true;
        fireBtn.textContent = '✨ SPLIT!';
        fireBtn.classList.add('split-ready');
      } else {
        canSplitMidAir = false;
        fireBtn.disabled = true;
      }
    }

    // Win Condition: Knocking out EITHER the Enemy King OR the Enemy Cannon Turret wins immediately!
    function sideDefeated(side) {
      const hasKing = targets.some(t => t.side === side && t.kind === 'king');
      const hasTurret = mode === 'puzzle' ? true : targets.some(t => t.side === side && t.kind === 'turret');
      return !hasKing || !hasTurret;
    }

    function endTurnAfterSettle() {
      canSplitMidAir = false;
      const fireBtn = document.getElementById('fire-btn');
      fireBtn.classList.remove('split-ready');
      fireBtn.textContent = '🔥 FIRE!';

      if (sideDefeated('right')) {
        lastWinFlag = true;
        document.getElementById('modal-icon').textContent = '🏆💥👑';
        document.getElementById('modal-title').textContent = mode === 'pass' ? 'LEFT CASTLE WINS!' : 'ENEMY DEFEATED!';
        document.getElementById('modal-sub').textContent = `Wave ${wave} Cleared! Awesome artillery shot!`;
        document.getElementById('siege-modal').style.display = 'flex';
        return;
      }
      if (mode !== 'puzzle' && sideDefeated('left')) {
        lastWinFlag = false;
        document.getElementById('modal-icon').textContent = '💥🛡️⚔️';
        document.getElementById('modal-title').textContent = mode === 'pass' ? 'RIGHT CASTLE WINS!' : 'GOBLINS GOT YOUR BASE!';
        document.getElementById('modal-sub').textContent = 'Rebuild your fortress and blast them back!';
        document.getElementById('siege-modal').style.display = 'flex';
        return;
      }

      if (mode === 'puzzle') {
        shotsLeft--;
        if (shotsLeft <= 0) {
          lastWinFlag = false;
          document.getElementById('modal-icon').textContent = '💣🔄🏰';
          document.getElementById('modal-title').textContent = 'OUT OF CANNONBALLS!';
          document.getElementById('modal-sub').textContent = 'Try again — snipe the red TNT block!';
          document.getElementById('siege-modal').style.display = 'flex';
          return;
        }
        fireBtn.disabled = false;
        rollWind();
        syncControlsUI();
      } else if (mode === 'pass') {
        activeTurn = activeTurn === 'left' ? 'right' : 'left';
        rollWind();
        fireBtn.disabled = false;
        document.getElementById('sky-toast').textContent = activeTurn === 'left' ? '🟢 Player 1 (Left) Turn!' : '🔵 Player 2 (Right) Turn!';
        syncControlsUI();
      } else if (mode === 'duel') {
        if (activeTurn === 'left') {
          activeTurn = 'right';
          syncControlsUI();
          document.getElementById('sky-toast').textContent = '👹 Watch out! Goblin Cannon is firing back!';
          setTimeout(() => {
            const aiPos = getCannonPos('right');
            const heroTarget = targets.find(t => t.side === 'left') || getCannonPos('left');
            const world = SIEGE_WORLDS[worldIdx];
            const shot = SiegeBuilder.solveAIShot(aiPos.x, aiPos.y, heroTarget.x, heroTarget.y, wind, world.grav, wave, TIME_STEP, SPEED_MUL);
            launchShot('right', 180 - shot.angle, shot.power, 'heavy');
          }, 850);
        } else {
          activeTurn = 'left';
          rollWind();
          fireBtn.disabled = false;
          document.getElementById('sky-toast').textContent = '🟢 Your Turn! Hit the 🎯 Red Cannon OR 👹 Goblin King!';
          syncControlsUI();
        }
      }
    }

    const setAngle = (v) => { playerState[activeTurn].angle = Math.max(10, Math.min(85, Number(v))); syncControlsUI(); };
    const setPower = (v) => { playerState[activeTurn].power = Math.max(20, Math.min(100, Number(v))); syncControlsUI(); };
    document.getElementById('ang-slider').oninput = (e) => setAngle(e.target.value);
    document.getElementById('pwr-slider').oninput = (e) => setPower(e.target.value);
    document.getElementById('ang-minus').onpointerdown = () => setAngle(playerState[activeTurn].angle - 2);
    document.getElementById('ang-plus').onpointerdown  = () => setAngle(playerState[activeTurn].angle + 2);
    document.getElementById('pwr-minus').onpointerdown = () => setPower(playerState[activeTurn].power - 3);
    document.getElementById('pwr-plus').onpointerdown  = () => setPower(playerState[activeTurn].power + 3);

    document.querySelectorAll('.ammo-btn').forEach(btn => {
      btn.onpointerdown = () => {
        const type = btn.dataset.ammo;
        if (type !== 'heavy' && playerState[activeTurn].ammo[type] <= 0) return;
        selectedAmmo = type;
        syncControlsUI();
      };
    });

    function triggerClusterSplit() {
      if (!canSplitMidAir || projectiles.length === 0) return;
      canSplitMidAir = false;
      const p = projectiles[0];
      playBoom(420, 0.18, 'square', 0.24);
      [-2.2, 0, 2.2].forEach(spread => {
        projectiles.push({
          side: p.side, ammo: 'mini', age: 22, x: p.x, y: p.y,
          vx: p.vx + spread, vy: p.vy - 1.0, bounces: 0, recordGhost: false
        });
      });
      projectiles.shift();
      document.getElementById('fire-btn').classList.remove('split-ready');
      document.getElementById('fire-btn').disabled = true;
    }

    document.getElementById('fire-btn').onpointerdown = () => {
      if (canSplitMidAir) { triggerClusterSplit(); return; }
      if (projectiles.length > 0) return;
      const st = playerState[activeTurn];
      if (selectedAmmo !== 'heavy') st.ammo[selectedAmmo]--;
      launchShot(activeTurn, st.angle, st.power, selectedAmmo);
      syncControlsUI();
    };

    let draggingAim = false;
    canvas.addEventListener('pointerdown', (e) => {
      if (canSplitMidAir) { triggerClusterSplit(); return; }
      if (projectiles.length > 0 || (mode === 'duel' && activeTurn === 'right')) return;
      draggingAim = true;
      updateDragAim(e);
    });
    canvas.addEventListener('pointermove', (e) => { if (draggingAim) updateDragAim(e); });
    window.addEventListener('pointerup', () => { draggingAim = false; });

    function updateDragAim(e) {
      const r = canvas.getBoundingClientRect();
      const mx = ((e.clientX - r.left) / r.width) * W;
      const my = ((e.clientY - r.top) / r.height) * H;
      const cPos = getCannonPos(activeTurn);
      const dx = activeTurn === 'left' ? (mx - cPos.x) : (cPos.x - mx);
      const dy = cPos.y - my;
      if (dx > 8 && dy > 4) {
        setAngle((Math.atan2(dy, dx) * 180) / Math.PI);
        setPower(Math.hypot(dx, dy) * 0.42);
      }
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === mode);
      btn.onpointerdown = () => {
        mode = btn.dataset.mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        setupBattle(true);
      };
    });

    document.getElementById('world-btn').onpointerdown = () => {
      worldIdx = (worldIdx + 1) % SIEGE_WORLDS.length;
      document.getElementById('world-btn').textContent = SIEGE_WORLDS[worldIdx].name;
      setupBattle(false);
    };

    document.getElementById('next-wave-btn').onpointerdown = () => {
      if (lastWinFlag) wave++;
      setupBattle(false);
    };

    let settleWait = 0;
    let tick = 0;
    function render() {
      tick++;
      const world = SIEGE_WORLDS[worldIdx];

      // 1. Safe Gravity Settling for Blocks & Targets
      blocks.forEach((b, idx) => {
        let supportY = SiegeBuilder.groundAt(ground, b.x + b.w / 2);
        blocks.forEach((other, j) => {
          if (idx !== j && Math.abs(other.x - b.x) < b.w * 0.78 && other.y > b.y) {
            supportY = Math.min(supportY, other.y);
          }
        });
        if (b.y + b.h < supportY - 1) {
          b.vy += 0.25;
          b.y = Math.min(supportY - b.h, b.y + b.vy);
        } else {
          if (b.vy > 4.6) b.hp--;
          b.vy = 0; b.y = supportY - b.h;
        }
      });
      blocks = blocks.filter(b => b.hp > 0);

      targets.forEach(t => {
        if (t.kind === 'turret') {
          t.y = SiegeBuilder.groundAt(ground, t.x) - 12;
          return;
        }
        let supportY = SiegeBuilder.groundAt(ground, t.x);
        blocks.forEach(b => {
          if (t.x >= b.x - 4 && t.x <= b.x + b.w + 4 && b.y >= t.y) supportY = Math.min(supportY, b.y);
        });
        if (t.y + t.r < supportY - 1) {
          t.vy += 0.25;
          t.y = Math.min(supportY - t.r, t.y + t.vy);
        } else {
          if (t.vy > 4.8) t.hp = 0;
          t.vy = 0; t.y = supportY - t.r;
        }
      });
      targets = targets.filter(t => t.hp > 0);

      // 2. Projectile Step
      const hadProj = projectiles.length > 0;
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.age++;
        p.vx += wind * TIME_STEP;
        p.vy += world.grav * TIME_STEP;
        p.x += p.vx * TIME_STEP;
        p.y += p.vy * TIME_STEP;

        if (p.recordGhost && (p.side === 'left' || mode === 'pass') && p.age % 5 === 0) {
          playerState[p.side].ghost.push({ x: p.x, y: p.y });
        }

        if (p.x < -40 || p.x > W + 40 || p.y > H + 50) {
          projectiles.splice(i, 1);
          continue;
        }

        const hitGround = p.y >= SiegeBuilder.groundAt(ground, p.x);
        const hitBlock = blocks.some(b =>
          (p.age > 18 || b.side !== p.side) &&
          p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h
        );
        const hitTarget = targets.some(t =>
          (p.age > 18 || t.side !== p.side) &&
          Math.hypot(p.x - t.x, p.y - t.y) <= t.r + 7
        );

        if (hitGround || hitBlock || hitTarget) {
          if (p.bounces > 0 && hitGround) {
            p.bounces--;
            p.y = SiegeBuilder.groundAt(ground, p.x) - 3;
            p.vy = -Math.abs(p.vy) * 0.72;
            detonate(p.x, p.y, 26, 1);
          } else {
            const rad = p.ammo === 'heavy' ? 44 : 32;
            const dmg = p.ammo === 'heavy' ? 2 : 1;
            detonate(p.x, p.y, rad, dmg);
            projectiles.splice(i, 1);
          }
        }
      }

      if (hadProj && projectiles.length === 0) settleWait = 30;
      if (settleWait > 0) {
        settleWait--;
        if (settleWait === 0) endTurnAfterSettle();
      }

      // 3. Draw Sky Backdrop
      ctx.clearRect(0, 0, W, H);
      if (bgReady && worldIdx === 0) {
        ctx.drawImage(bgImg, 0, 0, W, H);
      } else {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, world.skyTop); g.addColorStop(1, world.skyBot);
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      }

      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      windLeaves.forEach(lf => {
        lf.x += wind * 180 + 0.12; lf.y += 0.18;
        if (lf.x > W) lf.x = 0; if (lf.x < 0) lf.x = W;
        if (lf.y > H * 0.72) lf.y = 12;
        ctx.fillRect(lf.x, lf.y, 5, 2.5);
      });

      // 4. Draw Destructible Terrain
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x < W; x += 2) ctx.lineTo(x, ground[x]);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fillStyle = world.dirt; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = world.rock; ctx.stroke();
      ctx.restore();

      // 5. Previous Shot Ghost Trail
      ctx.fillStyle = 'rgba(255, 255, 255, 0.38)';
      playerState[activeTurn].ghost.forEach(pt => {
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.8, 0, Math.PI * 2); ctx.fill();
      });

      // 6. Curved 12-Dot Parabolic Launch Preview (Shows Initial Arc Shape!)
      if (projectiles.length === 0 && (activeTurn === 'left' || mode === 'pass')) {
        const cPos = getCannonPos(activeTurn);
        const st = playerState[activeTurn];
        const rad = activeTurn === 'left' ? (st.angle * Math.PI) / 180 : ((180 - st.angle) * Math.PI) / 180;
        const speed = st.power * SPEED_MUL;
        let sx = cPos.x + Math.cos(rad) * 22, sy = cPos.y - Math.sin(rad) * 22;
        let svx = Math.cos(rad) * speed, svy = -Math.sin(rad) * speed;

        for (let step = 1; step <= 72; step++) {
          svx += wind * TIME_STEP;
          svy += world.grav * TIME_STEP;
          sx += svx * TIME_STEP;
          sy += svy * TIME_STEP;
          if (step % 6 === 0) {
            ctx.fillStyle = `rgba(253, 224, 71, ${1 - step / 80})`;
            ctx.beginPath(); ctx.arc(sx, sy, 3.2, 0, Math.PI * 2); ctx.fill();
          }
        }
      }

      // 7. Fortress Blocks
      const matColors = { stone: '#64748B', wood: '#B45309', ice: '#38BDF8', tnt: '#DC2626' };
      blocks.forEach(b => {
        ctx.fillStyle = matColors[b.mat];
        ctx.strokeStyle = b.hp < b.maxHp ? '#FEF08A' : '#0F172A';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 4); ctx.fill(); ctx.stroke();
        if (b.mat === 'tnt') {
          ctx.font = 'bold 10px Fredoka, sans-serif';
          ctx.fillStyle = '#FEF08A'; ctx.textAlign = 'center';
          ctx.fillText('TNT', b.x + b.w / 2, b.y + 13);
        }
      });

      // 8. Draw King Bosses + Targetable Cannons with Live Health Bars!
      targets.forEach(t => {
        if (t.kind === 'king') {
          // Pulsing target ring on enemy King so kids always see the goal!
          if (t.side === 'right') {
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.75)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(t.x, t.y, t.r + 4 + Math.sin(tick * 0.15) * 3, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.font = '32px sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(t.icon, t.x, t.y);
        }
        // Health Bar above every King & Turret!
        const barW = 34, barH = 6;
        ctx.fillStyle = '#0F172A';
        ctx.fillRect(t.x - barW / 2, t.y - 28, barW, barH);
        ctx.fillStyle = t.side === 'left' ? '#06D6A0' : '#EF4444';
        ctx.fillRect(t.x - barW / 2 + 1, t.y - 27, (barW - 2) * (t.hp / t.maxHp), barH - 2);
      });

      ['left', ...(mode === 'puzzle' ? [] : ['right'])].forEach(side => {
        const turretAlive = mode === 'puzzle' ? true : targets.some(t => t.side === side && t.kind === 'turret');
        if (!turretAlive) return;
        const cPos = getCannonPos(side);
        ctx.fillStyle = '#475569'; ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(cPos.x - 15, cPos.y + 2, 30, 12, 4); ctx.fill(); ctx.stroke();

        const ang = side === 'left' ? playerState.left.angle : playerState.right.angle;
        const rad = side === 'left' ? (ang * Math.PI) / 180 : ((180 - ang) * Math.PI) / 180;
        ctx.save();
        ctx.translate(cPos.x, cPos.y);
        ctx.rotate(-rad);
        ctx.fillStyle = side === 'left' ? '#0EA5E9' : '#EF4444';
        ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.roundRect(0, -6, 24, 12, 4); ctx.fill(); ctx.stroke();
        ctx.restore();
        ctx.fillStyle = '#1E293B';
        ctx.beginPath(); ctx.arc(cPos.x, cPos.y + 3, 8.5, 0, Math.PI * 2); ctx.fill();
      });

      // 9. Cannonballs, Sparks & Hit Popups
      projectiles.forEach(p => {
        ctx.fillStyle = p.ammo === 'cluster' ? '#38BDF8' : (p.ammo === 'bouncer' ? '#F97316' : '#FDE047');
        ctx.beginPath(); ctx.arc(p.x, p.y, p.ammo === 'mini' ? 5 : 7, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#0F172A'; ctx.stroke();
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.life--;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 5, 5);
      }

      for (let i = popups.length - 1; i >= 0; i--) {
        const pop = popups[i];
        pop.y -= 0.9; pop.life--;
        if (pop.life <= 0) { popups.splice(i, 1); continue; }
        ctx.font = 'bold 18px Fredoka, sans-serif';
        ctx.fillStyle = pop.color; ctx.strokeStyle = '#090D16'; ctx.lineWidth = 4;
        ctx.textAlign = 'center';
        ctx.strokeText(pop.text, pop.x, pop.y);
        ctx.fillText(pop.text, pop.x, pop.y);
      }

      requestAnimationFrame(render);
    }

    setupBattle(true);
    requestAnimationFrame(render);
  </script>
</body>
</html>
