<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>We're Going on a Ghost Hunt!</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ghost-hunt.css">
</head>
<body>
  <div id="ghost-app">
    <header>
      <div style="display:flex;gap:8px;align-items:center;">
        <a href="index.html" class="nav-btn">🏠 Back</a>
        <button class="mode-btn active" id="mode-story">🗺️ Full Hunt</button>
        <button class="mode-btn" id="mode-flash">🔦 Flashlight Only</button>
      </div>

      <div class="step-dots">
        <span class="s-dot curr" id="dot-0">🌾</span>
        <span class="s-dot" id="dot-1">🫧</span>
        <span class="s-dot" id="dot-2">🕸️</span>
        <span class="s-dot" id="dot-3">🔦</span>
        <span class="s-dot" id="dot-4">🏃</span>
      </div>

      <div class="album-pill">👻 Found: <span id="found-count">0</span>/6</div>
    </header>

    <main class="stage-wrap" id="stage-wrap">
      <div class="chant-banner" id="chant-banner" title="Tap to sing along!">🌾 Tall wavy grass! Swipe the grass: Swish, swash!</div>
      <canvas id="hunt-canvas" width="960" height="500"></canvas>

      <div id="sprint-hud">
        <button class="foot-btn next-step" id="foot-left"><span>👈</span><span>LEFT FOOT!</span></button>
        <div class="sprint-hint" id="zone-hint">👣 ALTERNATE LEFT & RIGHT TO REACH THE BED!</div>
        <button class="foot-btn" id="foot-right"><span>👉</span><span>RIGHT FOOT!</span></button>
      </div>
    </main>
  </div>

  <div id="cozy-modal">
    <div class="cozy-card">
      <div style="font-size:56px;">🛌🌟🐶🐉</div>
      <div style="font-size:34px;font-weight:700;color:#FDE047;" id="cozy-title">SAFE UNDER THE COVERS!</div>
      <div style="font-size:20px;color:#E9D5FF;" id="cozy-sub">You outran the silly ghost! We're not scared!</div>
      <div class="album-row" id="album-row"></div>
      <button class="again-btn" id="again-btn">👻 Go on Another Ghost Hunt!</button>
    </div>
  </div>

  <script src="ghost-stages.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const profile = params.get('kid') || localStorage.getItem('activeKid') || 'emma';
    const isEmma = profile === 'emma';
    const heroIcon = isEmma ? '🐶' : '🐉';

    function syncViewport() {
      const vv = window.visualViewport;
      const w = Math.round(vv ? vv.width : document.documentElement.clientWidth || window.innerWidth);
      const h = Math.round(vv ? vv.height : document.documentElement.clientHeight || window.innerHeight);
      if (w > 0 && h > 0) {
        document.documentElement.style.setProperty('--app-w', `${w}px`);
        document.documentElement.style.setProperty('--app-h', `${h}px`);
      }
    }
    window.addEventListener('resize', syncViewport);
    window.addEventListener('pageshow', syncViewport);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', syncViewport);
    [0, 80, 250].forEach(ms => setTimeout(syncViewport, ms));

    const W = 960, H = 500;
    const canvas = document.getElementById('hunt-canvas');
    const ctx = canvas.getContext('2d');

    const darkCanvas = document.createElement('canvas');
    darkCanvas.width = W; darkCanvas.height = H;
    const darkCtx = darkCanvas.getContext('2d');

    // Narrow Flashlight Aperture Constants (Smaller & More Challenging!)
    const BEAM_INNER = 20;
    const BEAM_OUTER = 80;
    const BEAM_RING  = 70;
    const HIT_RADIUS = 56;

    const mansionImg = new Image();
    let mansionReady = false;
    const imgPaths = ['images/ghost-mansion.jpg', 'images/ghost-mansion.jpeg', 'images/ghost-mansion.png', 'ghost-mansion.jpg'];
    let pathIdx = 0;
    mansionImg.onload = () => { mansionReady = true; };
    mansionImg.onerror = () => { pathIdx++; if (pathIdx < imgPaths.length) mansionImg.src = imgPaths[pathIdx]; };
    mansionImg.src = imgPaths[0];

    let unlocked = JSON.parse(localStorage.getItem('ghostAlbum') || '[]');
    let flashlightOnly = false;
    // stage: 0=Grass, 1=Swamp, 2=Cobwebs, 3=Flashlight, 4=Straight Track Chase, 5=Cozy Victory
    let stage = 0;
    let grassBlades = [];
    let mudBubbles = [];
    let cobwebs = [];
    let activeGhost = SILLY_GHOSTS[0];
    let ghostSpot = { x: 700, y: 240, charge: 0, revealed: false };
    let decoys = [];
    let beam = { x: W / 2, y: H / 2 };
    let pointerDown = false;

    // Stage 4: Full-Screen Straight 48-Step Track State!
    const TOTAL_STEPS = 48;
    const TRACK_X0 = 86;
    const TRACK_X1 = 874;
    const TRACK_Y  = 258;
    let heroStep = 6;          // Discrete tile index (0..48)
    let heroVisualStep = 6;    // Smooth visual interpolation between tiles
    let heroHop = 0;
    let ghostStep = 0;         // Continuous ghost position along the 48 tiles
    let expectedFoot = 'left'; // Strictly alternates 'left' <-> 'right'!
    let ghostPauseFrames = 0;  // Brief laugh pause after a 4-step knockback

    let sparkles = [];
    let popups = [];
    let tick = 0;
    let audioCtx = null;

    function updateAlbumHUD() {
      document.getElementById('found-count').textContent = unlocked.length;
      document.getElementById('album-row').innerHTML = SILLY_GHOSTS.map(g => `
        <div class="g-badge ${unlocked.includes(g.id) ? 'unlocked' : ''}" title="${g.name}">${g.hat}</div>
      `).join('');
    }
    updateAlbumHUD();

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function speak(txt) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.rate = 0.98; u.pitch = 1.12;
      window.speechSynthesis.speak(u);
    }

    function playSound(f1, f2, dur = 0.16, type = 'sine', vol = 0.22) {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f1, now);
        o.frequency.exponentialRampToValueAtTime(Math.max(40, f2), now + dur);
        g.gain.setValueAtTime(vol, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now); o.stop(now + dur);
      } catch (_) {}
    }

    function spawnSparkles(x, y, color = '#FDE047', n = 18) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
        sparkles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, color, life: 30 });
      }
    }

    function syncFootButtons() {
      document.getElementById('foot-left').classList.toggle('next-step', expectedFoot === 'left');
      document.getElementById('foot-right').classList.toggle('next-step', expectedFoot === 'right');
    }

    function syncStepDots() {
      for (let i = 0; i < 5; i++) {
        const d = document.getElementById(`dot-${i}`);
        d.className = 's-dot' + (i < stage ? ' done' : (i === stage ? ' curr' : ''));
      }
    }

    function enterStage(s) {
      stage = s;
      syncStepDots();
      const wrap = document.getElementById('stage-wrap');
      wrap.classList.remove('danger-close', 'stumble-shake');
      document.getElementById('cozy-modal').style.display = 'none';
      document.getElementById('sprint-hud').style.display = s === 4 ? 'flex' : 'none';
      const banner = document.getElementById('chant-banner');

      if (s === 0) {
        grassBlades = Array.from({ length: 14 }, (_, i) => ({ x: 110 + i * 58, cleared: false, bend: 0 }));
        banner.textContent = "🌾 We're going on a ghost hunt! Swipe the tall grass: Swish, swash!";
        speak("We're going on a ghost hunt! Swipe the tall wavy grass! Swish, swash!");
      } else if (s === 1) {
        mudBubbles = Array.from({ length: 5 }, (_, i) => ({
          num: i + 1, x: 170 + i * 155, y: 250 + (i % 2 === 0 ? -45 : 45), r: 52, popped: false
        }));
        banner.textContent = '🫧 Bubbly swamp mud! Pop all 5 bubbles: Squelch, squerch!';
        speak('Uh oh, bubbly mud! Pop the five bubbles! Squelch, squerch!');
      } else if (s === 2) {
        cobwebs = [
          { x: 350, y: 180, cleared: false }, { x: 610, y: 180, cleared: false },
          { x: 360, y: 340, cleared: false }, { x: 600, y: 340, cleared: false }
        ];
        banner.textContent = '🕸️ Spooky mansion door! Brush away the 4 cobwebs: Tiptoe, tiptoe!';
        speak('A spooky door! Brush away the cobwebs! Tiptoe, tiptoe!');
      } else if (s === 3) {
        const unfound = SILLY_GHOSTS.filter(g => !unlocked.includes(g.id));
        const pool = unfound.length > 0 ? unfound : SILLY_GHOSTS;
        activeGhost = pool[Math.floor(Math.random() * pool.length)];

        const spots = [
          { x: 175, y: 205 }, { x: 775, y: 195 },
          { x: 225, y: 380 }, { x: 740, y: 370 }, { x: 480, y: 205 }
        ].sort(() => Math.random() - 0.5);

        ghostSpot = { x: spots[0].x, y: spots[0].y, charge: 0, revealed: false };
        decoys = spots.slice(1, 4).map((pt, idx) => ({
          x: pt.x, y: pt.y, ...DECOY_FRIENDS[idx % DECOY_FRIENDS.length], found: false
        }));
        beam = { x: W / 2, y: H - 85 };

        banner.textContent = "🔦 Shhh... Tiny Flashlight! Search the dark room carefully!";
        speak("What's that in the dark? Search carefully with your flashlight!");
      } else if (s === 4) {
        // Initialize Straight 48-Step Escape Race!
        heroStep = 6;
        heroVisualStep = 6;
        heroHop = 0;
        ghostStep = 0;
        expectedFoot = 'left';
        ghostPauseFrames = 36; // 0.6s head-start reaction moment when race appears!
        popups = [];
        syncFootButtons();
        document.getElementById('zone-hint').textContent = '👣 TAP GLOWING FOOT: LEFT ➔ RIGHT ➔ LEFT!';
        banner.textContent = `👻 RACE TO THE COZY BED! (${TOTAL_STEPS - heroStep} steps left!)`;
        speak(`Run back to the cozy bed! Left, right, left, right!`);
      }
    }

    function finishRunHome() {
      if (stage === 5) return;
      stage = 5;

      document.getElementById('stage-wrap').classList.remove('danger-close', 'stumble-shake');
      document.getElementById('sprint-hud').style.display = 'none';

      if (!unlocked.includes(activeGhost.id)) {
        unlocked.push(activeGhost.id);
        localStorage.setItem('ghostAlbum', JSON.stringify(unlocked));
      }
      updateAlbumHUD();

      document.getElementById('cozy-sub').textContent = `You outran the ${activeGhost.hat} ${activeGhost.name}! Phew, we're not scared!`;
      document.getElementById('cozy-modal').style.display = 'flex';

      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        setTimeout(() => playSound(f, f * 1.02, 0.22, 'triangle', 0.24), i * 95);
      });
      speak("Safe under the cozy blanket! Phew! We're not scared!");
    }

    function stepX(stepVal) {
      return TRACK_X0 + (Math.max(0, Math.min(TOTAL_STEPS, stepVal)) / TOTAL_STEPS) * (TRACK_X1 - TRACK_X0);
    }

    // Alternating Footstep Handler: Advances Exactly 1 Tile Per Correct Alternating Tap!
    function tryAlternateStep(foot) {
      if (stage !== 4) return;
      if (foot !== expectedFoot) {
        // Tapped same foot twice -> tiny warning thud & flash hint!
        playSound(150, 120, 0.07, 'sawtooth', 0.14);
        document.getElementById('zone-hint').textContent = `👆 TAP ${expectedFoot.toUpperCase()} FOOT NEXT!`;
        return;
      }

      heroStep = Math.min(TOTAL_STEPS, heroStep + 1);
      heroHop = 16;
      expectedFoot = expectedFoot === 'left' ? 'right' : 'left';
      syncFootButtons();

      const hx = stepX(heroStep);
      playSound(280 + heroStep * 6, 390 + heroStep * 6, 0.07, 'triangle', 0.18);
      spawnSparkles(hx, TRACK_Y + 20, '#06D6A0', 5);

      const rem = TOTAL_STEPS - heroStep;
      document.getElementById('chant-banner').textContent = rem > 0
        ? `🏃 GO GO GO! ${rem} STEPS TO THE COZY BED!`
        : `🛌 MADE IT!!`;
      document.getElementById('zone-hint').textContent = expectedFoot === 'left' ? '👈 NOW TAP LEFT!' : '👉 NOW TAP RIGHT!';

      if (heroStep >= TOTAL_STEPS) {
        finishRunHome();
      }
    }

    document.getElementById('foot-left').onpointerdown = (e) => {
      e.preventDefault(); e.stopPropagation();
      tryAlternateStep('left');
    };
    document.getElementById('foot-right').onpointerdown = (e) => {
      e.preventDefault(); e.stopPropagation();
      tryAlternateStep('right');
    };

    // Optional Keyboard Left/Right Arrow Support for Testing on Laptop!
    window.addEventListener('keydown', (e) => {
      if (stage !== 4 || e.repeat) return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') tryAlternateStep('left');
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') tryAlternateStep('right');
    });

    function handlePointer(e, isDownTap = false) {
      if (stage === 5 || stage === 4) return;
      const r = canvas.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * W;
      const y = ((e.clientY - r.top) / r.height) * H;

      if (stage === 0) {
        grassBlades.forEach(b => {
          if (!b.cleared && Math.abs(x - b.x) < 46) {
            b.cleared = true;
            b.bend = x < b.x ? 55 : -55;
            playSound(320, 540, 0.1, 'triangle', 0.16);
            spawnSparkles(b.x, y, '#4ADE80', 8);
          }
        });
        if (grassBlades.every(b => b.cleared)) {
          playSound(523, 784, 0.22, 'triangle');
          setTimeout(() => enterStage(1), 450);
        }
      } else if (stage === 1 && isDownTap) {
        mudBubbles.forEach(b => {
          if (!b.popped && Math.hypot(x - b.x, y - b.y) < b.r + 16) {
            b.popped = true;
            const poppedCount = mudBubbles.filter(m => m.popped).length;
            playSound(190 + poppedCount * 55, 420, 0.16, 'sine', 0.28);
            spawnSparkles(b.x, b.y, '#C084FC', 18);
            speak(String(poppedCount));
            if (poppedCount === mudBubbles.length) setTimeout(() => enterStage(2), 650);
          }
        });
      } else if (stage === 2) {
        cobwebs.forEach(w => {
          if (!w.cleared && Math.hypot(x - w.x, y - w.y) < 75) {
            w.cleared = true;
            playSound(440, 680, 0.12, 'triangle', 0.2);
            spawnSparkles(w.x, w.y, '#E2E8F0', 14);
          }
        });
        if (cobwebs.every(w => w.cleared)) {
          playSound(180, 95, 0.45, 'sawtooth', 0.2);
          setTimeout(() => enterStage(3), 550);
        }
      } else if (stage === 3) {
        beam.x = x; beam.y = y;
      }
    }

    canvas.addEventListener('pointerdown', (e) => { pointerDown = true; handlePointer(e, true); });
    canvas.addEventListener('pointermove', (e) => { if (pointerDown || stage === 3) handlePointer(e, false); });
    window.addEventListener('pointerup', () => { pointerDown = false; });

    document.getElementById('mode-story').onpointerdown = () => {
      flashlightOnly = false;
      document.getElementById('mode-story').classList.add('active');
      document.getElementById('mode-flash').classList.remove('active');
      enterStage(0);
    };
    document.getElementById('mode-flash').onpointerdown = () => {
      flashlightOnly = true;
      document.getElementById('mode-flash').classList.add('active');
      document.getElementById('mode-story').classList.remove('active');
      enterStage(3);
    };
    document.getElementById('again-btn').onpointerdown = () => enterStage(flashlightOnly ? 3 : 0);
    document.getElementById('chant-banner').onpointerdown = () => speak(document.getElementById('chant-banner').textContent);

    // Stage 4: Full-Screen Straight Stadium Track Renderer & Knockback Logic!
    function updateAndDrawStraightChase() {
      heroVisualStep += (heroStep - heroVisualStep) * 0.38;
      heroHop *= 0.78;

      // Ghost Steady Advance (~3.05 steps/sec for Wyatt, ~2.25 steps/sec for Emma)
      const ghostSpdPerFrame = isEmma ? 0.038 : 0.051;
      if (ghostPauseFrames > 0) {
        ghostPauseFrames--;
      } else {
        ghostStep += ghostSpdPerFrame;
      }

      const gapSteps = heroStep - ghostStep;
      const dangerClose = gapSteps <= 5.5;
      const wrap = document.getElementById('stage-wrap');
      wrap.classList.toggle('danger-close', dangerClose);

      if (dangerClose && ghostPauseFrames === 0 && tick % 20 === 0) {
        playSound(140, 95, 0.1, 'sawtooth', 0.18);
      }

      // Option B: Caught by Ghost -> 4-Step Knockback Stumble!
      if (ghostStep >= heroStep - 0.35 && ghostPauseFrames === 0 && heroStep < TOTAL_STEPS) {
        heroStep = Math.max(3, heroStep - 4);
        ghostStep = Math.max(0, heroStep - 5.5);
        ghostPauseFrames = 52; // Brief breather (~0.85s) so kid can mash back up to speed!

        wrap.classList.remove('stumble-shake');
        void wrap.offsetWidth;
        wrap.classList.add('stumble-shake');

        const kx = stepX(heroStep);
        spawnSparkles(kx, TRACK_Y - 15, '#EF4444', 28);
        popups.push({ x: kx, y: TRACK_Y - 58, text: '👻 BOO! -4 STEPS!', life: 48 });
        playSound(480, 170, 0.32, 'sawtooth', 0.26);
        document.getElementById('chant-banner').textContent = `👻 OOPS! KNOCKED BACK 4 STEPS! TAP FASTER!`;
        speak('Boo! Knocked back! Keep tapping left, right!');
      }

      // 1. Night Sky & 4 Clear Background Biome Bands Across the Screen
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#0F172A');
      sky.addColorStop(0.65, '#1E1B4B');
      sky.addColorStop(1, '#090D16');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      const zones = [
        { s0: 0,  s1: 12, color: '#451A03', border: '#D97706', icon: '🚪', label: 'MANSION' },
        { s0: 12, s1: 24, color: '#334155', border: '#94A3B8', icon: '🕸️', label: 'COBWEBS' },
        { s0: 24, s1: 36, color: '#4C1D95', border: '#C084FC', icon: '🫧', label: 'SWAMP MUD' },
        { s0: 36, s1: 48, color: '#14532D', border: '#4ADE80', icon: '🌾', label: 'TALL GRASS' }
      ];

      // Draw Zone Banners & Scenery Props Behind the Track
      zones.forEach(z => {
        const xStart = stepX(z.s0);
        const xEnd   = stepX(z.s1);
        const midX   = (xStart + xEnd) / 2;

        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.beginPath();
        ctx.roundRect(xStart + 3, 92, xEnd - xStart - 6, 232, 16);
        ctx.fill();

        ctx.font = 'bold 13px Fredoka, sans-serif';
        ctx.fillStyle = z.border;
        ctx.textAlign = 'center';
        ctx.fillText(`${z.icon} ${z.label}`, midX, 114);

        ctx.font = '34px sans-serif';
        ctx.fillText(z.icon, midX - 38, 156);
        ctx.fillText(z.icon, midX + 38, 156);
      });

      // 2. Straight Track Bed & All 48 Discrete Stepping Tiles!
      ctx.fillStyle = '#020617';
      ctx.strokeStyle = '#64748B';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(TRACK_X0 - 22, TRACK_Y - 26, (TRACK_X1 - TRACK_X0) + 56, 56, 18);
      ctx.fill();
      ctx.stroke();

      const tileStepW = (TRACK_X1 - TRACK_X0) / TOTAL_STEPS;
      for (let i = 0; i <= TOTAL_STEPS; i++) {
        const tx = stepX(i);
        const z = zones.find(zn => i >= zn.s0 && i <= zn.s1) || zones[3];
        const passed = i <= heroStep;

        ctx.fillStyle = passed ? '#06D6A0' : z.color;
        ctx.strokeStyle = i === heroStep ? '#FEF08A' : 'rgba(255,255,255,0.28)';
        ctx.lineWidth = i === heroStep ? 2.5 : 1;
        ctx.beginPath();
        ctx.roundRect(tx - tileStepW * 0.42, TRACK_Y - 17, tileStepW * 0.84, 34, 5);
        ctx.fill();
        ctx.stroke();
      }

      // 3. Start Haunted Door (Left) & Checkered Finish Flag + Cozy Bed (Far Right)!
      ctx.font = '56px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🚪', TRACK_X0 - 34, TRACK_Y - 8);

      // Checkered Finish Line Strip at Step 48
      const finX = stepX(TOTAL_STEPS);
      for (let r = 0; r < 6; r++) {
        ctx.fillStyle = r % 2 === 0 ? '#FFFFFF' : '#0F172A';
        ctx.fillRect(finX - 5, TRACK_Y - 24 + r * 8, 5, 8);
        ctx.fillStyle = r % 2 === 1 ? '#FFFFFF' : '#0F172A';
        ctx.fillRect(finX, TRACK_Y - 24 + r * 8, 5, 8);
      }
      ctx.font = '68px sans-serif';
      ctx.fillText('🛌', finX + 42, TRACK_Y - 10);
      ctx.font = 'bold 14px Fredoka, sans-serif';
      ctx.fillStyle = '#FDE047';
      ctx.fillText('FINISH!', finX + 40, TRACK_Y + 38);

      // 4. Draw Chasing Ghost & Stepping Hero Right on the Track!
      const gx = stepX(ghostStep);
      const hx = stepX(heroVisualStep);

      GhostArt.drawSillyGhost(ctx, gx, TRACK_Y - 30, dangerClose ? 0.82 : 0.72, activeGhost, tick);

      // Glowing Foot Ring Under Hero
      ctx.fillStyle = 'rgba(6, 214, 160, 0.35)';
      ctx.beginPath();
      ctx.ellipse(hx, TRACK_Y + 8, 22, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = '58px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(heroIcon, hx, TRACK_Y - 22 - heroHop);

      // Floating Knockback Popups
      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        p.y -= 0.7; p.life--;
        if (p.life <= 0) { popups.splice(i, 1); continue; }
        ctx.font = 'bold 20px Fredoka, sans-serif';
        ctx.strokeStyle = '#090D16'; ctx.lineWidth = 4;
        ctx.fillStyle = '#FCA5A5';
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillText(p.text, p.x, p.y);
      }
    }

    function render() {
      tick++;
      ctx.clearRect(0, 0, W, H);

      if (stage === 0) {
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#1E1B4B'); sky.addColorStop(1, '#064E3B');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
        ctx.font = '88px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(heroIcon, W / 2, H - 115);

        grassBlades.forEach((b, i) => {
          const sway = b.cleared ? b.bend : Math.sin(tick * 0.08 + i) * 14;
          ctx.save();
          ctx.strokeStyle = b.cleared ? 'rgba(34,197,94,0.32)' : '#22C55E';
          ctx.lineWidth = 26; ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(b.x, H);
          ctx.quadraticCurveTo(b.x + sway, H * 0.55, b.x + sway * 1.8, b.cleared ? H * 0.68 : 115);
          ctx.stroke();
          ctx.restore();
        });
      } else if (stage === 1) {
        ctx.fillStyle = '#2E1065'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#581C87'; ctx.fillRect(0, H * 0.52, W, H * 0.48);

        mudBubbles.forEach((b, i) => {
          if (b.popped) return;
          const bob = Math.sin(tick * 0.1 + i) * 8;
          ctx.save();
          ctx.fillStyle = 'rgba(192, 132, 252, 0.85)';
          ctx.strokeStyle = '#FEF08A'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(b.x, b.y + bob, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.font = 'bold 36px Fredoka, sans-serif';
          ctx.fillStyle = '#FFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('🫧', b.x, b.y + bob);
          ctx.restore();
        });
      } else if (stage === 2) {
        ctx.fillStyle = '#1E1B4B'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#78350F'; ctx.strokeStyle = '#F59E0B'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.roundRect(W / 2 - 140, 95, 280, H - 95, [140, 140, 0, 0]); ctx.fill(); ctx.stroke();

        cobwebs.forEach(w => {
          if (w.cleared) return;
          ctx.font = '96px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('🕸️', w.x, w.y);
        });
      } else if (stage === 3) {
        if (mansionReady) ctx.drawImage(mansionImg, 0, 0, W, H);
        else GhostArt.drawMansionFallback(ctx, W, H);

        decoys.forEach(d => {
          ctx.font = '56px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(d.icon, d.x, d.y);
          if (!d.found && Math.hypot(beam.x - d.x, beam.y - d.y) < HIT_RADIUS) {
            d.found = true;
            playSound(420, 620, 0.14, 'triangle');
            spawnSparkles(d.x, d.y, '#38BDF8', 14);
            speak(d.say);
          }
        });

        const distGhost = Math.hypot(beam.x - ghostSpot.x, beam.y - ghostSpot.y);
        if (distGhost < HIT_RADIUS + 6 && !ghostSpot.revealed) {
          ghostSpot.charge = Math.min(100, ghostSpot.charge + 2.8);
          if (tick % 8 === 0) playSound(480 + ghostSpot.charge * 4, 520 + ghostSpot.charge * 4, 0.07, 'sine', 0.15);
          if (ghostSpot.charge >= 100) {
            ghostSpot.revealed = true;
            spawnSparkles(ghostSpot.x, ghostSpot.y, '#FDE047', 40);
            [523, 659, 784, 987].forEach((f, i) => setTimeout(() => playSound(f, f * 1.05, 0.18, 'triangle', 0.25), i * 75));
            speak(`${activeGhost.giggle} It's the ${activeGhost.name}!`);
            setTimeout(() => {
              if (flashlightOnly) finishRunHome();
              else enterStage(4);
            }, 1550);
          }
        }

        GhostArt.drawSillyGhost(ctx, ghostSpot.x, ghostSpot.y, ghostSpot.revealed ? 1.3 : 0.95, activeGhost, tick);

        if (!ghostSpot.revealed) {
          darkCtx.clearRect(0, 0, W, H);
          darkCtx.fillStyle = 'rgba(4, 5, 18, 0.96)';
          darkCtx.fillRect(0, 0, W, H);

          // Tighter 80px Flashlight Aperture!
          darkCtx.globalCompositeOperation = 'destination-out';
          const hole = darkCtx.createRadialGradient(beam.x, beam.y, BEAM_INNER, beam.x, beam.y, BEAM_OUTER);
          hole.addColorStop(0, 'rgba(0,0,0,1)');
          hole.addColorStop(0.62, 'rgba(0,0,0,0.88)');
          hole.addColorStop(1, 'rgba(0,0,0,0)');
          darkCtx.fillStyle = hole;
          darkCtx.beginPath(); darkCtx.arc(beam.x, beam.y, BEAM_OUTER, 0, Math.PI * 2); darkCtx.fill();
          darkCtx.globalCompositeOperation = 'source-over';

          ctx.drawImage(darkCanvas, 0, 0);

          ctx.strokeStyle = 'rgba(253, 224, 71, 0.55)';
          ctx.lineWidth = 3.5;
          ctx.beginPath(); ctx.arc(beam.x, beam.y, BEAM_RING, 0, Math.PI * 2); ctx.stroke();

          if (distGhost > BEAM_OUTER + 8) GhostArt.drawPeekingEyes(ctx, ghostSpot.x, ghostSpot.y - 14, tick, 1);
          decoys.forEach((d, idx) => {
            if (!d.found && Math.hypot(beam.x - d.x, beam.y - d.y) > BEAM_OUTER + 8) {
              GhostArt.drawPeekingEyes(ctx, d.x, d.y - 6, tick, idx + 3);
            }
          });
        }
      } else if (stage === 4) {
        updateAndDrawStraightChase();
      } else if (stage === 5) {
        ctx.fillStyle = '#0F172A';
        ctx.fillRect(0, 0, W, H);
      }

      for (let i = sparkles.length - 1; i >= 0; i--) {
        const p = sparkles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) { sparkles.splice(i, 1); continue; }
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2); ctx.fill();
      }

      requestAnimationFrame(render);
    }

    enterStage(0);
    requestAnimationFrame(render);
  </script>
</body>
</html>
