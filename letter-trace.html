<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Laser Letter Racer!</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --app-w: 100vw; --app-h: 100dvh; }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; position: fixed; inset: 0;
      font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
      background: radial-gradient(circle at 50% 35%, #1E293B 0%, #0F172A 70%, #020617 100%);
      color: #fff; touch-action: none;
    }
    #app-stage {
      position: fixed; inset: 0; width: var(--app-w); height: var(--app-h);
      display: grid; grid-template-rows: 74px 1fr 84px; padding: 12px 18px; gap: 10px;
    }
    body.overheat-shake { animation: heatShake 0.14s infinite; }
    body.blowout-flash::after {
      content: ''; position: fixed; inset: 0; background: rgba(239, 68, 68, 0.55);
      pointer-events: none; z-index: 70;
    }
    @keyframes heatShake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-4px, 3px); }
      75% { transform: translate(4px, -3px); }
    }

    /* Top Header: Back, Word Picker, Flow Toggle & Laser Temp */
    header {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(15, 23, 42, 0.92); border: 3px solid #38BDF8;
      border-radius: 26px; padding: 8px 16px; gap: 10px; z-index: 20;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .nav-btn, .mode-btn, .flow-btn {
      font-family: inherit; font-weight: 700; font-size: 17px;
      background: #1E293B; color: #F8FAFC; border: 3px solid #475569;
      padding: 8px 14px; border-radius: 20px; cursor: pointer;
      display: flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap;
    }
    .mode-bar { display: flex; gap: 8px; overflow-x: auto; align-items: center; }
    .mode-btn.active {
      background: #FBBF24; color: #0F172A; border-color: #FEF08A;
      transform: scale(1.04); box-shadow: 0 4px 14px rgba(251,191,36,0.4);
    }
    .flow-btn.on {
      background: #06D6A0; color: #0F172A; border-color: #A7F3D0;
    }

    /* Overheat Gauge */
    .heat-box {
      display: flex; align-items: center; gap: 10px;
      background: #020617; border: 3px solid #334155; border-radius: 20px;
      padding: 6px 14px; min-width: 195px;
    }
    .heat-label { font-size: 14px; font-weight: 700; color: #94A3B8; white-space: nowrap; }
    .heat-track {
      flex: 1; height: 18px; background: #1E293B; border-radius: 99px;
      overflow: hidden; border: 2px solid #475569;
    }
    .heat-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #06D6A0 0%, #FBBF24 55%, #EF4444 100%);
      transition: width 0.08s linear;
    }

    /* Center Tracing Arena */
    .arena {
      position: relative; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, #1E293B 0%, #090D16 100%);
      border-radius: 30px; border: 4px solid #38BDF8; overflow: hidden;
      box-shadow: inset 0 0 40px rgba(56, 189, 248, 0.15), 0 12px 30px rgba(0,0,0,0.5);
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .coach-banner {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92); border: 3px solid #FBBF24;
      color: #FEF08A; padding: 7px 22px; border-radius: 99px;
      font-size: 21px; font-weight: 700; cursor: pointer; z-index: 10;
      white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }

    /* Bottom Word / Alphabet Progress Bar */
    footer {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: rgba(15, 23, 42, 0.92); border: 3px solid #38BDF8;
      border-radius: 26px; padding: 8px 18px; overflow-x: auto; z-index: 20;
    }
    .letter-tile {
      min-width: 58px; height: 60px; border-radius: 18px;
      background: #1E293B; border: 3px solid #475569; color: #94A3B8;
      font-size: 32px; font-weight: 700; display: flex; align-items: center;
      justify-content: center; cursor: pointer; transition: 0.2s; padding: 0 12px;
    }
    .letter-tile.active {
      background: #38BDF8; color: #0F172A; border-color: #FFF;
      transform: scale(1.14); box-shadow: 0 0 18px rgba(56,189,248,0.7);
    }
    .letter-tile.done {
      background: #06D6A0; color: #0F172A; border-color: #FFF;
    }

    /* Celebration Modal */
    #win-modal {
      display: none; position: fixed; inset: 0; z-index: 80;
      background: rgba(2, 6, 23, 0.82); backdrop-filter: blur(5px);
      align-items: center; justify-content: center;
    }
    .win-card {
      background: #0F172A; border: 5px solid #FBBF24; border-radius: 38px;
      padding: 34px 54px; text-align: center; display: flex; flex-direction: column;
      align-items: center; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }
    .next-btn {
      background: #06D6A0; color: #0F172A; border: none; border-radius: 99px;
      padding: 14px 38px; font-size: 26px; font-weight: 700; font-family: inherit; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app-stage">
    <header>
      <a href="index.html" class="nav-btn">🏠 Back</a>

      <div class="mode-bar" id="mode-bar">
        <button class="mode-btn active" data-word="NAME" id="name-btn">🦖 WYATT</button>
        <button class="mode-btn" data-word="SIBLING" id="sib-btn">🦄 EMMA</button>
        <button class="mode-btn" data-word="DOG">🐶 DOG</button>
        <button class="mode-btn" data-word="CAT">🐱 CAT</button>
        <button class="mode-btn" data-word="MOM">❤️ MOM</button>
        <button class="mode-btn" data-word="DAD">⭐ DAD</button>
        <button class="mode-btn" data-word="AZ">🔤 A-Z</button>
      </div>

      <button class="flow-btn on" id="flow-btn" title="Hold finger down across strokes!">⚡ No-Lift: ON</button>

      <div class="heat-box">
        <span class="heat-label" id="heat-icon">🌡️ LASER</span>
        <div class="heat-track"><div class="heat-fill" id="heat-fill"></div></div>
      </div>
    </header>

    <main class="arena">
      <div class="coach-banner" id="coach-banner" title="Tap to hear letter">Letter W</div>
      <canvas id="trace-canvas"></canvas>
    </main>

    <footer id="letter-bar"></footer>
  </div>

  <div id="win-modal">
    <div class="win-card">
      <div style="font-size:84px;">🏆✨</div>
      <div style="font-size:48px;font-weight:700;color:#FDE047;" id="win-title">WYATT!</div>
      <div style="font-size:22px;color:#CBD5E1;">Great letter tracing!</div>
      <button class="next-btn" id="next-word-btn">🔄 Trace Again!</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const profile = params.get('kid') || localStorage.getItem('activeKid') || 'wyatt';
    const isEmma = profile === 'emma';

    const primaryName = isEmma ? 'EMMA' : 'WYATT';
    const siblingName = isEmma ? 'WYATT' : 'EMMA';
    document.getElementById('name-btn').textContent = (isEmma ? '🦄 ' : '🦖 ') + primaryName;
    document.getElementById('sib-btn').textContent = (isEmma ? '🦖 ' : '🦄 ') + siblingName;

    // Fluid Kindergarten Manuscript Stroke Definitions (0..100 Normalized Space)
    const STROKES = {
      A: [ [[50,12],[20,88]], [[50,12],[80,88]], [[31,58],[69,58]] ],
      B: [ [[26,12],[26,88]], [[26,12],[64,16],[74,31],[64,47],[26,49],[68,52],[76,69],[66,85],[26,88]] ],
      C: [ [[74,24],[50,12],[26,26],[20,50],[26,74],[50,88],[74,76]] ],
      D: [ [[26,12],[26,88]], [[26,12],[62,16],[78,36],[78,64],[62,84],[26,88]] ],
      E: [ [[26,12],[26,88],[74,88]], [[26,12],[74,12]], [[26,48],[66,48]] ],
      F: [ [[26,12],[26,88]], [[26,12],[74,12]], [[26,48],[66,48]] ],
      G: [ [[74,24],[50,12],[26,26],[20,50],[26,74],[50,88],[74,76],[74,52],[50,52]] ],
      H: [ [[24,12],[24,88]], [[76,12],[76,88]], [[24,48],[76,48]] ],
      I: [ [[28,12],[72,12]], [[50,12],[50,88]], [[28,88],[72,88]] ],
      J: [ [[28,12],[76,12]], [[54,12],[54,72],[42,88],[26,84],[20,70]] ],
      K: [ [[26,12],[26,88]], [[74,12],[28,48],[76,88]] ],
      L: [ [[28,12],[28,88],[74,88]] ],
      M: [ [[18,12],[18,88]], [[18,12],[50,60],[82,12],[82,88]] ],
      N: [ [[24,12],[24,88]], [[24,12],[76,88],[76,12]] ],
      O: [ [[50,12],[24,26],[18,50],[24,74],[50,88],[76,74],[82,50],[76,26],[50,12]] ],
      P: [ [[26,12],[26,88]], [[26,12],[66,16],[76,32],[66,48],[26,50]] ],
      Q: [ [[50,12],[24,26],[18,50],[24,74],[50,88],[76,74],[82,50],[76,26],[50,12]], [[56,62],[80,88]] ],
      R: [ [[26,12],[26,88]], [[26,12],[66,16],[76,32],[66,48],[26,50],[76,88]] ],
      S: [ [[72,22],[50,12],[28,22],[30,42],[70,58],[72,78],[50,88],[28,78]] ],
      T: [ [[18,12],[82,12]], [[50,12],[50,88]] ],
      U: [ [[24,12],[24,68],[38,86],[62,86],[76,68],[76,12]] ],
      V: [ [[20,12],[50,88],[80,12]] ],
      W: [ [[14,12],[32,88],[50,28],[68,88],[86,12]] ],
      X: [ [[22,12],[78,88]], [[78,12],[22,88]] ],
      Y: [ [[22,12],[50,48]], [[78,12],[50,48],[50,88]] ],
      Z: [ [[22,12],[78,12],[22,88],[78,88]] ]
    };

    const PHONETIC_NAMES = {
      A: 'A', B: 'Bee', C: 'See', D: 'Dee', E: 'E', F: 'Eff', G: 'Jee',
      H: 'Aitch', I: 'Eye', J: 'Jay', K: 'Kay', L: 'El', M: 'Em', N: 'En',
      O: 'Oh', P: 'Pee', Q: 'Cue', R: 'Ar', S: 'Ess', T: 'Tee', U: 'You',
      V: 'Vee', W: 'Double-U', X: 'Ex', Y: 'Why', Z: 'Zee'
    };

    const CW = 900, CH = 500;
    const canvas = document.getElementById('trace-canvas');
    canvas.width = CW; canvas.height = CH;
    const ctx = canvas.getContext('2d');

    let currentWord = primaryName.split('');
    let letterIdx = 0;
    let strokeIdx = 0;
    let densePath = [];
    let progressIdx = 0;
    let isTracing = false;
    let pointerDown = false;
    let strokeCompleted = false; // Guard lock so resting on Finish Flag can never multi-fire!
    let advanceTimer = null;
    let noLiftMode = true;
    let heat = 0;
    let isOffTrack = false;
    let pointerPos = { x: 0, y: 0 };
    let sparks = [];
    let tick = 0;
    let audioCtx = null;

    // 1. Pixel Tablet Viewport Fix
    function syncViewport() {
      const vv = window.visualViewport;
      const w = Math.round(vv ? vv.width : document.documentElement.clientWidth || window.innerWidth);
      const h = Math.round(vv ? vv.height : document.documentElement.clientHeight || window.innerHeight);
      if (w > 0 && h > 0) {
        document.documentElement.style.setProperty('--app-w', `${w}px`);
        document.documentElement.style.setProperty('--app-h', `${h}px`);
      }
    }
    window.addEventListener('resize', syncViewport);
    window.addEventListener('pageshow', syncViewport);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) syncViewport(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', syncViewport);
    [0, 60, 180, 450].forEach(ms => setTimeout(syncViewport, ms));

    // 2. Minimal, Clean Voice & Synth Audio
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function speakLetterOrWord(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const spoken = text.length === 1 ? (PHONETIC_NAMES[text.toUpperCase()] || text) : text;
      const u = new SpeechSynthesisUtterance(spoken);
      u.rate = text.length === 1 ? 0.88 : 0.94;
      u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    }

    function playTone(f1, f2, dur = 0.14, type = 'triangle', vol = 0.22) {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f1, now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, f2), now + dur);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + dur);
    }

    const flowBtn = document.getElementById('flow-btn');
    flowBtn.onpointerdown = () => {
      noLiftMode = !noLiftMode;
      flowBtn.classList.toggle('on', noLiftMode);
      flowBtn.textContent = noLiftMode ? '⚡ No-Lift: ON' : '✋ Lift Stroke: ON';
      playTone(440, 660, 0.12);
    };

    // 3. Build Dense Waypoints for Current Stroke
    function toCanvasXY(pt) {
      return {
        x: 250 + (pt[0] / 100) * 400,
        y: 78 + (pt[1] / 100) * 370
      };
    }

    function buildDenseStroke(rawPoints) {
      const out = [];
      for (let i = 0; i < rawPoints.length - 1; i++) {
        const p1 = toCanvasXY(rawPoints[i]);
        const p2 = toCanvasXY(rawPoints[i + 1]);
        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const steps = Math.max(8, Math.ceil(dist / 6));
        for (let s = 0; s < steps; s++) {
          const t = s / steps;
          out.push({ x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t });
        }
      }
      out.push(toCanvasXY(rawPoints[rawPoints.length - 1]));
      return out;
    }

    function setHeat(val) {
      heat = Math.max(0, Math.min(100, val));
      document.getElementById('heat-fill').style.width = `${heat}%`;
      document.getElementById('heat-icon').textContent = heat > 60 ? '🔥 HOT!' : '🌡️ LASER';
      document.body.classList.toggle('overheat-shake', heat > 40 && isTracing);
    }

    function renderLetterBar() {
      const bar = document.getElementById('letter-bar');
      bar.innerHTML = '';
      currentWord.forEach((ch, idx) => {
        const tile = document.createElement('div');
        tile.className = 'letter-tile' + (idx === letterIdx ? ' active' : (idx < letterIdx ? ' done' : ''));
        tile.textContent = ch;
        tile.onpointerdown = () => {
          letterIdx = idx;
          loadLetter(true);
        };
        bar.appendChild(tile);
      });
    }

    function updateBanner() {
      const ch = currentWord[letterIdx];
      const strokes = STROKES[ch] || STROKES.A;
      document.getElementById('coach-banner').textContent =
        strokes.length > 1
          ? `Letter ${ch} • Part ${strokeIdx + 1} of ${strokes.length}`
          : `Trace Letter ${ch}`;
    }

    function loadLetter(announce = true) {
      if (advanceTimer) {
        clearTimeout(advanceTimer);
        advanceTimer = null;
      }
      strokeIdx = 0;
      progressIdx = 0;
      isTracing = false;
      pointerDown = false; // Require fresh touch when a brand-new letter appears
      strokeCompleted = false;
      setHeat(0);
      const ch = currentWord[letterIdx];
      const strokes = STROKES[ch] || STROKES.A;
      densePath = buildDenseStroke(strokes[0]);
      renderLetterBar();
      updateBanner();
      if (announce) speakLetterOrWord(ch);
    }

    function loadStroke(sIdx) {
      const ch = currentWord[letterIdx];
      const strokes = STROKES[ch] || STROKES.A;
      strokeIdx = sIdx;
      progressIdx = 0;
      strokeCompleted = false;
      setHeat(0);
      densePath = buildDenseStroke(strokes[strokeIdx]);
      updateBanner();

      if (!noLiftMode) {
        isTracing = false;
        pointerDown = false;
      } else if (pointerDown) {
        // Only engage immediately if the new stroke starts right where the last one ended;
        // otherwise wait until the child slides over to the new green start star!
        const d = Math.hypot(pointerPos.x - densePath[0].x, pointerPos.y - densePath[0].y);
        isTracing = d <= 58;
      }
    }

    document.getElementById('coach-banner').onpointerdown = () => {
      speakLetterOrWord(currentWord[letterIdx]);
    };

    // 4. Mode Picker Buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onpointerdown = () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const w = btn.dataset.word;
        if (w === 'NAME') currentWord = primaryName.split('');
        else if (w === 'SIBLING') currentWord = siblingName.split('');
        else if (w === 'AZ') currentWord = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        else currentWord = w.split('');
        letterIdx = 0;
        loadLetter(true);
      };
    });

    // 5. Pointer Tracking, No-Lift Chaining & Overheat Check
    function getCanvasPt(e) {
      const r = canvas.getBoundingClientRect();
      return {
        x: ((e.clientX - r.left) / r.width) * CW,
        y: ((e.clientY - r.top) / r.height) * CH
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (strokeCompleted) return;
      canvas.setPointerCapture(e.pointerId);
      pointerDown = true;
      const pt = getCanvasPt(e);
      pointerPos = pt;

      const targetPt = densePath[progressIdx];
      const dist = Math.hypot(pt.x - targetPt.x, pt.y - targetPt.y);

      if (dist <= 64) {
        isTracing = true;
        isOffTrack = false;
        playTone(440, 580, 0.1, 'sine', 0.18);
      } else {
        playTone(220, 170, 0.14, 'triangle', 0.15);
        for (let i = 0; i < 10; i++) {
          sparks.push({ x: targetPt.x, y: targetPt.y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, color: '#06D6A0', life: 22 });
        }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!pointerDown || strokeCompleted) return;
      const pt = getCanvasPt(e);
      pointerPos = pt;

      // In No-Lift mode between strokes of the SAME letter, only lock on when near the start star (progressIdx === 0)
      if (!isTracing && noLiftMode && progressIdx === 0) {
        const startPt = densePath[0];
        if (Math.hypot(pt.x - startPt.x, pt.y - startPt.y) <= 58) {
          isTracing = true;
          isOffTrack = false;
          playTone(440, 580, 0.09, 'sine', 0.16);
        }
        return;
      }

      if (!isTracing) return;

      let bestIdx = progressIdx;
      let minDist = Infinity;
      const maxLookAhead = Math.min(densePath.length - 1, progressIdx + 16);

      for (let i = progressIdx; i <= maxLookAhead; i++) {
        const d = Math.hypot(pt.x - densePath[i].x, pt.y - densePath[i].y);
        if (d < minDist) {
          minDist = d;
          bestIdx = i;
        }
      }

      if (minDist <= 56) {
        isOffTrack = false;
        setHeat(heat - 2.8);
        if (bestIdx > progressIdx) {
          progressIdx = bestIdx;
          if (progressIdx % 6 === 0) {
            const p = progressIdx / densePath.length;
            playTone(360 + p * 380, 400 + p * 380, 0.06, 'sine', 0.12);
          }
          sparks.push({
            x: densePath[progressIdx].x,
            y: densePath[progressIdx].y,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,
            color: '#06D6A0',
            life: 16
          });
        }

        if (progressIdx >= densePath.length - 2) {
          completeCurrentStroke();
        }
      } else {
        isOffTrack = true;
        setHeat(heat + 3.4);
        if (tick % 5 === 0) playTone(145, 110, 0.07, 'sawtooth', 0.16);
        sparks.push({
          x: pt.x, y: pt.y,
          vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7,
          color: '#EF4444', life: 18
        });

        if (heat >= 100) {
          triggerOverheatBlowout();
        }
      }
    });

    window.addEventListener('pointerup', () => {
      pointerDown = false;
      isTracing = false;
      isOffTrack = false;
      document.body.classList.remove('overheat-shake');
    });

    function triggerOverheatBlowout() {
      isTracing = false;
      isOffTrack = false;
      progressIdx = 0;
      setHeat(0);
      playTone(130, 55, 0.4, 'sawtooth', 0.3);
      document.body.classList.add('blowout-flash');
      setTimeout(() => document.body.classList.remove('blowout-flash'), 380);
    }

    function completeCurrentStroke() {
      if (strokeCompleted) return; // Prevents multi-triggering while finger rests on flag!
      strokeCompleted = true;
      isTracing = false;
      isOffTrack = false;
      setHeat(0);
      playTone(523.25, 1046.5, 0.22, 'triangle', 0.28);

      const ch = currentWord[letterIdx];
      const strokes = STROKES[ch] || STROKES.A;
      if (strokeIdx + 1 < strokes.length) {
        loadStroke(strokeIdx + 1);
      } else {
        // Whole letter finished! Release pointerDown so resting on the flag never triggers the next letter
        pointerDown = false;
        if (letterIdx + 1 < currentWord.length) {
          advanceTimer = setTimeout(() => {
            letterIdx++;
            loadLetter(true);
          }, 480);
        } else {
          advanceTimer = setTimeout(handleWordWin, 520);
        }
      }
    }

    function handleWordWin() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        setTimeout(() => playTone(f, f * 1.02, 0.28, 'triangle', 0.3), i * 110);
      });
      const wordStr = currentWord.join('');
      document.getElementById('win-title').textContent = wordStr.length <= 6 ? `${wordStr}!` : 'AWESOME!';
      document.getElementById('win-modal').style.display = 'flex';
      if (wordStr.length <= 6) speakLetterOrWord(wordStr);
    }

    document.getElementById('next-word-btn').onclick = () => {
      document.getElementById('win-modal').style.display = 'none';
      letterIdx = 0;
      loadLetter(true);
    };

    // 6. 60 FPS Canvas Renderer
    function drawStrokePolyline(pts, width, color, dash = []) {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = width;
      ctx.strokeStyle = color;
      ctx.setLineDash(dash);
      ctx.beginPath();
      pts.forEach((p, idx) => {
        const c = toCanvasXY(p);
        if (idx === 0) ctx.moveTo(c.x, c.y);
        else ctx.lineTo(c.x, c.y);
      });
      ctx.stroke();
      ctx.restore();
    }

    function render() {
      tick++;
      if (!isTracing && heat > 0) setHeat(heat - 0.9);

      ctx.clearRect(0, 0, CW, CH);

      // Handwriting guidelines
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.22)';
      ctx.lineWidth = 3;
      ctx.setLineDash([]);
      [122, 404].forEach(y => { ctx.beginPath(); ctx.moveTo(140, y); ctx.lineTo(760, y); ctx.stroke(); });
      ctx.setLineDash([12, 12]);
      ctx.beginPath(); ctx.moveTo(140, 263); ctx.lineTo(760, 263); ctx.stroke();
      ctx.setLineDash([]);

      const ch = currentWord[letterIdx];
      const strokes = STROKES[ch] || STROKES.A;

      strokes.forEach((s, idx) => {
        drawStrokePolyline(s, 58, 'rgba(30, 41, 59, 0.85)');
        drawStrokePolyline(s, 50, idx < strokeIdx ? '#06D6A0' : 'rgba(51, 65, 85, 0.7)');
      });

      const activeRaw = strokes[strokeIdx];
      drawStrokePolyline(activeRaw, 54, isOffTrack ? 'rgba(239, 68, 68, 0.45)' : 'rgba(56, 189, 248, 0.28)');
      ctx.save();
      ctx.lineDashOffset = -(tick * 1.2);
      drawStrokePolyline(activeRaw, 6, 'rgba(253, 224, 71, 0.65)', [14, 18]);
      ctx.restore();

      if (progressIdx > 0 && densePath.length > 0) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 46;
        ctx.strokeStyle = '#06D6A0';
        ctx.shadowColor = '#06D6A0';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        for (let i = 0; i <= progressIdx; i++) {
          if (i === 0) ctx.moveTo(densePath[i].x, densePath[i].y);
          else ctx.lineTo(densePath[i].x, densePath[i].y);
        }
        ctx.stroke();
        ctx.restore();
      }

      if (densePath.length > 1) {
        const endPt = densePath[densePath.length - 1];
        ctx.beginPath();
        ctx.arc(endPt.x, endPt.y, 24, 0, Math.PI * 2);
        ctx.fillStyle = '#F59E0B';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#FFF';
        ctx.stroke();
        ctx.font = '24px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🏁', endPt.x, endPt.y);

        const curPt = densePath[progressIdx];
        const pulse = 28 + Math.sin(tick * 0.14) * 4;
        ctx.beginPath();
        ctx.arc(curPt.x, curPt.y, pulse, 0, Math.PI * 2);
        ctx.fillStyle = isOffTrack ? '#EF4444' : '#06D6A0';
        ctx.fill();
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();

        ctx.font = '30px sans-serif';
        ctx.fillText(progressIdx === 0 ? '⭐' : (isEmma ? '🐶' : '🐉'), curPt.x, curPt.y);
      }

      if (isTracing && isOffTrack && densePath[progressIdx]) {
        const curPt = densePath[progressIdx];
        ctx.save();
        ctx.strokeStyle = '#EF4444';
        ctx.lineWidth = 5;
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        ctx.moveTo(curPt.x, curPt.y);
        ctx.lineTo(pointerPos.x, pointerPos.y);
        ctx.stroke();
        ctx.font = '34px sans-serif';
        ctx.fillText('🔥', pointerPos.x, pointerPos.y);
        ctx.restore();
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        const sp = sparks[i];
        sp.x += sp.vx; sp.y += sp.vy; sp.life--;
        if (sp.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.fillStyle = sp.color;
        ctx.fillRect(sp.x, sp.y, 5, 5);
      }

      requestAnimationFrame(render);
    }

    loadLetter(true);
    render();
  </script>
</body>
